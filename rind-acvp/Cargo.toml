[package]
name = "rind-acvp"
version = "0.1.0"
edition = "2024"
publish = false
rust-version.workspace = true
description = "Unpublished ACVP module wrapper for rind"

[dependencies]
rind = { path = "../rind", features = ["__acvp", "wipe"] }

[dev-dependencies]
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
serde_json = "1"
