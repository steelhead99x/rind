[package]
name = "rind-bench-report"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Unpublished reader for rind's benchmark report. admin/bench-report stays the command during the side-by-side period."

[dependencies]
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
serde_json = "1"
