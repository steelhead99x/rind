name: timing

# Times rind's RSA-OAEP decryption on GitHub's x86_64 and arm64 runners with
# `admin/timing`: the Marvin toolkit's probes. Weekly, since a run takes hours
# of runner time, and a leak shows on any run. At its own
# hour: see TESTING.md, "Scheduled workflows".

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

concurrency:
  group: timing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  marvin:
    name: marvin (${{ matrix.os }}, RSA-${{ matrix.bits }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        bits: [2048, 3072, 4096]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: marvin
        run: nix develop .#timing --command admin/timing marvin ${{ matrix.bits }}

      - name: Upload the analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marvin-${{ matrix.os }}-rsa${{ matrix.bits }}
          path: |
            .tmp/timing/marvin/rsa${{ matrix.bits }}/probes/report.*
            .tmp/timing/marvin/rsa${{ matrix.bits }}/probes/*.png
            .tmp/timing/marvin/rsa${{ matrix.bits }}/probes/analysis_results
          if-no-files-found: ignore
