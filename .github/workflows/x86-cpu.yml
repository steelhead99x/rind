name: x86-cpu

# Weekly, at its own hour: see TESTING.md, "Scheduled workflows".
#
# The merge queue and the weekly run run every SDE model; a pull request runs
# the ones admin/x86-cpu's MODELS marks `pr`, which says why. The queue's
# models report through `x86-cpu gate`, which skips, and so passes, on a pull
# request: GitHub admits a PR to the queue only once its required checks
# report, so this workflow has no `paths` filter, and `scope` decides instead.
# The skip comes from a job with no `needs`, as queue-build.yml's Build job
# has, so it reports when the run starts, not after the slow models. A PR whose
# head predates this workflow gets no run from it: queue.yml's `Report Queue`
# reports the context there (`gh workflow run queue.yml -f sha=<head>`), since
# a required input here would fail sh/release-check.sh's dispatch of the weekly
# run.
on:
  schedule:
    - cron: "23 8 * * 0"
  workflow_dispatch:
  pull_request:
    # A draft skips every job until it is marked ready, and turning a PR back
    # into a draft cancels its ready run: see CONTRIBUTING.md. `edited` covers
    # a PR retargeted to main, which needs the context too; `scope` runs no
    # model for an edit that is not a retarget.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A new push or a retarget replaces the PR's running models. An edit of a title
# or body is no change to test, so it gets a group of its own and cannot cancel
# a running model, which a run of the PR's group would.
concurrency:
  group: >-
    x86-cpu-${{ github.event.action == 'edited' && !github.event.changes.base
    && format('edit-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request or merge group runs the models only when sh/backends.sh
  # says its diff can reach x86_64 code, and always when it changes this
  # workflow or admin/x86-cpu. Every model of the event's set or none: each
  # selects its own set of dispatch paths, and no map from a changed file to
  # the paths that run it is kept. A merge group's diff is against its base.
  # release-plz's release PR, which only bumps versions and changelogs, runs
  # none: a `release-plz-` branch that moq-bot, release.yml's app, opened. A
  # merge group has no head_ref or pull request user, so its PR is read from the
  # queue's ref, `gh-readonly-queue/main/pr-<number>-<sha>`; the queue builds
  # one PR a group (queue.yml), so that is the group's PR.
  scope:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.reach.outputs.run }}
      matrix: ${{ steps.reach.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only sh/changed.sh reads history, and runs only for these events.
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 0 || 1 }}

      - id: reach
        shell: bash
        env:
          RELEASE_PR: ${{ startsWith(github.head_ref, 'release-plz-') && github.event.pull_request.user.login == 'moq-bot[bot]' }}
          BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          EDIT: ${{ github.event.action == 'edited' && !github.event.changes.base }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=true
          models=all
          if [ "$GITHUB_EVENT_NAME" = merge_group ] && [[ "$GROUP_REF" =~ /pr-([0-9]+)- ]]; then
            # A failed lookup leaves RELEASE_PR false: the models run.
            pr=$(gh api "repos/$REPO/pulls/${BASH_REMATCH[1]}" --jq '"\(.head.ref) \(.user.login)"' || true)
            if [[ "$pr" == release-plz-*' moq-bot[bot]' ]]; then RELEASE_PR=true; fi
          fi
          if [ "$EDIT" = true ]; then
            echo "A title or body edit changes nothing to test."
            run=false
          elif [ "$RELEASE_PR" = true ]; then
            echo "A release PR bumps only versions and changelogs."
            run=false
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then models='pr'; fi
            # The slow models run in queue-build.yml, not on a hosted runner.
            if [ "$GITHUB_EVENT_NAME" = merge_group ]; then models='queue'; fi
            changed=$(sh/changed.sh "${BASE:-origin/$GITHUB_BASE_REF}")
            if ! grep -qE '^(\.github/workflows/x86-cpu\.yml|admin/x86-cpu)$' <<<"$changed"; then
              reach=$(sh/backends.sh - <<<"$changed")
              echo "Backends the diff reaches: $(paste -sd' ' <<<"$reach")"
              grep -qxE 'all|x86_64' <<<"$reach" || run=false
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
          echo "matrix=$(python3 admin/x86-cpu matrix "$models")" | tee -a "$GITHUB_OUTPUT"

  # The release tests, built once for every model's job to run: a model
  # changes only which paths the same binaries take.
  build:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A merge group runs the hosted models without the slow ones (`matrix
    # queue`; the slow ones run in queue-build.yml). `build` (20, not a
    # measured time) and `check` (45, over the slowest remaining model's 36.1
    # measured minutes) run one after the other and leave 25 of the queue's 90
    # minutes for both hosted-runner waits. Those waits were 46 to 84 minutes at
    # p90, so a group can still expire: these catch a hang, they do not make
    # the hosted jobs fit (quest/m0/ci-speed/sde-pr-models.md).
    timeout-minutes: ${{ github.event_name == 'merge_group' && 20 || 360 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - uses: ./.github/actions/rust-cache
        with:
          shell: .#sde

      - name: Build (release)
        run: nix develop .#sde --command admin/x86-cpu archive

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86-cpu-tests
          path: target/x86-cpu-tests.tar
          retention-days: 1
          if-no-files-found: error

  # One job per SDE model, from admin/x86-cpu's MODELS: one for each distinct
  # set of dispatch paths that `rind/src/low/x86_64/cpu.rs` picks from cpuid,
  # each asserting its set with `RIND_TEST_X86_*`.
  #
  # A job each, not one job for all: SDE's speed depends on the host, and on
  # GitHub's AMD EPYC 7763 runners a model with the SHA extensions runs the
  # suite several times slower than on the other hosted runners, which took a
  # single job for every model past four hours.
  check:
    name: check (${{ matrix.model }})
    needs: [scope, build]
    runs-on: ubuntu-latest
    # A merge group's models report inside the queue's 90-minute window, which
    # the wait for a hosted runner and `build` also spend, or the group expires
    # unreported. See `build`'s timeout for the arithmetic.
    timeout-minutes: ${{ github.event_name == 'merge_group' && 45 || 360 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # The dev shell's `sde` runs Intel's binaries in a bubblewrap sandbox,
      # which needs the unprivileged user namespaces Ubuntu's AppArmor denies
      # an unprofiled program.
      # See UPSTREAM.md, "Ubuntu's AppArmor denies Intel SDE's sandbox".
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # SDE's speed depends on the host CPU, so this names it.
      - name: Host CPU
        run: grep -m1 'model name' /proc/cpuinfo

      # The build job's tests, which still read their vector files from the
      # checkout.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: x86-cpu-tests
          path: target

      # This skips aws-lc-rs's `large_digest` tests, which hash 8 GiB per
      # hash and took 21 to 28 minutes per SHA model under SDE. They check the
      # length counter, which no CPU path changes, and run natively in
      # build.yml.
      - name: Check ${{ matrix.model }}
        run: nix develop .#sde --command admin/x86-cpu test -${{ matrix.sde }} --skip large_digest
        env:
          RIND_TEST_X86_SSSE3: ${{ matrix.paths.SSSE3 }}
          RIND_TEST_X86_SSE41: ${{ matrix.paths.SSE41 }}
          RIND_TEST_X86_AES_HARDWARE: ${{ matrix.paths.AES_HARDWARE }}
          RIND_TEST_X86_AVX: ${{ matrix.paths.AVX }}
          RIND_TEST_X86_AVX2: ${{ matrix.paths.AVX2 }}
          RIND_TEST_X86_BMI2_ADX: ${{ matrix.paths.BMI2_ADX }}
          RIND_TEST_X86_SHA: ${{ matrix.paths.SHA }}
          RIND_TEST_X86_VAES_AES_GCM: ${{ matrix.paths.VAES_AES_GCM }}
          RIND_TEST_X86_AVX_MOVBE_AES_GCM: ${{ matrix.paths.AVX_MOVBE_AES_GCM }}
          RIND_TEST_X86_AVX512_AES_GCM: ${{ matrix.paths.AVX512_AES_GCM }}
          RIND_TEST_X86_AVX512_ML_KEM: ${{ matrix.paths.AVX512_ML_KEM }}
          RIND_TEST_X86_AVX512_RSA: ${{ matrix.paths.AVX512_RSA }}
          RIND_TEST_X86_MCDT: ${{ matrix.paths.MCDT }}

  # rind-fips's module answers ACVP's sets through rind-acvp on each of its
  # x86_64 paths: Diamond Rapids has every feature the module takes, and the
  # test's CPU masks reach its paths without AVX-512, then the baseline the
  # module requires. The large-data hash tests run natively, in build.yml.
  acvp:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'merge_group' && 75 || 360 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: ./.github/actions/rust-cache
        with:
          shell: .#sde

      - name: Check Diamond Rapids
        run: nix develop .#sde --command cargo test --release -p rind-acvp --features module --locked
        env:
          RIND_ACVP_WRAPPER_RUNNER: "sde -dmr --"

  # The result main's ruleset can require, `x86-cpu gate`, in two jobs, each
  # named so that only one claims that name on an event. A job whose `if:` is
  # false still reports a skipped check run on every event, merge_group
  # included, so a `gate-pr` also named `x86-cpu gate` on the queue's group
  # would satisfy the requirement when the group starts, before any model ran.
  # On a pull request `gate-pr` is `x86-cpu gate`, reported skipped, and so
  # passed, when the run starts: it has no `needs`, as queue-build.yml's Build
  # job has none, so it neither waits for the models nor is cancelled with
  # them. That is what lets GitHub admit the PR to the queue. On a merge group
  # it is `x86-cpu gate (pr)`, and the required name stays pending until `gate`
  # reports. No event is named 'never' (actionlint rejects a constant false),
  # so `gate-pr` always skips and `gate` is the only one that ever runs.
  gate-pr:
    name: ${{ github.event_name == 'merge_group' && 'x86-cpu gate (pr)' || 'x86-cpu gate' }}
    if: github.event_name == 'never'
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  # A merge group's gate: every model and the ACVP run, or a pass when the
  # group's diff misses x86_64 and they skip. On any other event it is
  # `x86-cpu gate (queue)`, skipped, so that it never claims the required name
  # behind `needs`, where a cancelled model would report it cancelled. `build`
  # is a need because `check` skips when it fails: a skip counts only when
  # `scope` found nothing to run.
  gate:
    name: ${{ github.event_name == 'merge_group' && 'x86-cpu gate' || 'x86-cpu gate (queue)' }}
    if: always() && github.event_name == 'merge_group'
    needs: [scope, build, check, acvp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every model passed or was out of scope
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .scope.result == "success" and
            (if .scope.outputs.run == "false"
             then [.build, .check, .acvp] | all(.result == "skipped")
             else [.build, .check, .acvp] | all(.result == "success")
             end)
          ' <<<"$NEEDS"
