name: PR check

# `just ci` over the PR's diff against its base: the merge queue's selection
# and modules, so a check that fails in the queue (an unstable-rustfmt import
# order) fails here first, plus the slower ones the queue leaves out, whose
# result rests on the PR's own diff: the site, the semver marks, the mutants
# pins, and the binary-size change, which admin/binary-size reports in the job
# summary without failing on it. Advisory: main's ruleset requires
# only queue-build.yml's contexts, which no job here replaces. The cross, MSRV,
# wasm, no-std, adapter-API, constant-time, structure, Python, Dart, OpenSSL,
# and patch modules gate no merge: check.yml runs every module over main
# nightly, as `just release-check` does before a release.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # release-plz's release PR, a `release-plz-` branch that moq-bot,
      # release.yml's app, opened, only bumps versions and changelogs, so it
      # builds no Rust here. It still checks the whole site, which quotes the
      # READMEs the release publishes, before it lands.
      BASE: ${{ startsWith(github.head_ref, 'release-plz-') && github.event.pull_request.user.login == 'moq-bot[bot]' && '--all' || format('origin/{0}', github.base_ref) }}
      CHECK_MODULES: ${{ startsWith(github.head_ref, 'release-plz-') && github.event.pull_request.user.login == 'moq-bot[bot]' && 'site' || '' }}
      # The squash commit's subject, which sh/semver.sh reads for a `!`.
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff against the base needs its merge-base.
          fetch-depth: 0

      - uses: ./.github/actions/just

      # A query failure fails this job.
      - name: Select work
        id: scope
        run: just ci-select "$BASE" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/nix
        if: steps.scope.outputs.needed == 'true'

      - name: Rust cache
        if: steps.scope.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restore main's cache (same job id as check.yml's) without a PR's
          # own copy crowding it out of the repository's cache quota.
          save-if: false

      - name: Check
        if: steps.scope.outputs.needed == 'true'
        run: nix develop --command just ci "$BASE"
