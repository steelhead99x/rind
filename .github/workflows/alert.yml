name: Alert

# Posts to Discord #alerts when a nightly or a release stops and nobody is
# watching the run. Reads the kixel-ai organization's DISCORD_WEBHOOK secret.
# A job that runs past its time limit ends cancelled, not timed_out. Release
# and Dart release set no timeout-minutes, so a hung publish dies at GitHub's
# 360-minute default.

permissions:
  contents: read
  # Classifying a cancellation reads the run's jobs and their check annotations.
  actions: read
  checks: read

on:
  workflow_run:
    # Matched by workflow `name:`, not filename. `sh/alert.sh check` requires
    # every workflow whose failure can go unseen. A workflow that runs only
    # from a pull request, as a caller, or from a manual dispatch is left out,
    # because someone is already watching that run.
    workflows:
      - asan
      - bench
      - dart-libraries
      - Dart release
      - coverage
      - miri
      - mutants
      - python
      - Release
    types:
      - completed

# No concurrency group: each run reports a different failed run, and the
# nightlies share a schedule, so cancelling would drop alerts.

jobs:
  discord:
    name: Discord
    # Scheduled runs post on failure or timed_out, and on cancelled only when
    # a job annotation says it exceeded its maximum execution time. That
    # includes the hosted runner's "The job running on runner ... has exceeded
    # the maximum execution time of ..." form, not only the timeout-minutes
    # sentence. A hand cancel, or a dispatch that replaces the nightly (these
    # workflows share one concurrency group per ref, with cancel-in-progress),
    # does not post. Release and Dart release post on failure, timed_out, and
    # a cancelled run that started a job. release.yml sets cancel-in-progress
    # to false, so a newer push leaves an in-progress publish running, but it
    # cancels a pending one waiting in the group. That pending run never
    # starts a job, so it does not post. A cancellation the jobs API cannot
    # classify still posts, and the embed says so.
    if: >-
      (github.event.workflow_run.event == 'schedule' &&
      contains(fromJSON('["failure", "timed_out", "cancelled"]'), github.event.workflow_run.conclusion)) ||
      (contains(fromJSON('["failure", "timed_out", "cancelled"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["Release", "Dart release"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_REPO: ${{ github.repository }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: sh/alert.sh discord
