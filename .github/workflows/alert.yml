name: Alert

# Posts scheduled, landing, release, and deploy failures to the Discord #alerts channel,
# since those runs have no pull request to turn red. Reads the kixel-ai
# organization's DISCORD_WEBHOOK secret.

permissions:
  contents: read
  # Telling a time-limit cancellation from any other reads the run's jobs and
  # their annotations.
  actions: read
  checks: read

on:
  workflow_run:
    # Matched by workflow `name:`, not filename. Only workflows that run outside
    # a pull request and a manual dispatch. `sh/alert.sh check` enforces the list.
    workflows:
      - bench
      - build
      - dart-libraries
      - ESP32-S3 SHA-256 layout
      - ESP32-S3 SHA-512 layout
      - Dart release
      - Check
      - coverage
      - ctgrind
      - fuzz
      - miri
      - mutants
      - prove
      - python
      - quality lints
      - regenerate
      - sanitizers
      - Site deploy
      - Release
      - timing
      - x86-cpu
      - xtensa
    types:
      - completed

# No concurrency group: each run reports a different failed run, and
# scheduled runs can finish together, so cancelling would drop alerts.

jobs:
  discord:
    name: Discord
    # A workflow alerts when a schedule or a push started it, whichever
    # workflow it is, not a dispatch, since whoever dispatched one is already
    # watching it: prove's runs on a push to main, which gate no merge, name
    # the commit that broke a proof here. Release alerts however it ran: it
    # follows the queue's pushes to main, which nobody watches. So do Site
    # deploy, which a merge to main starts, and Dart release, which a tag push
    # starts with nobody watching. A cancellation posts only when a job hit
    # its time limit (`sh/alert.sh timed-out`), since a newer run or a hand
    # cancel stops a run as a matter of course. Queue failures stay on the PR
    # and go to the queue watcher and fixer.
    if: >-
      contains(fromJSON('["failure", "timed_out", "cancelled"]'), github.event.workflow_run.conclusion) &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'push' ||
      contains(fromJSON('["Release", "Dart release", "Site deploy"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_REPO: ${{ github.repository }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: sh/alert.sh discord
