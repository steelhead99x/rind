name: mutants

# Nightly, mutates the Rust that changed in the last day with cargo-mutants,
# through `admin/mutants`, on each architecture rind has a runner for and on
# armv7 under qemu. A mutant no architecture's tests catch fails the run,
# which alert.yml reports: kill it with a test, or list it under
# `exclude_re` in .cargo/mutants.toml with why no test can. The x86_64 run's
# survivors are tried again under Intel SDE, on the AVX-512 paths no runner
# takes. Dispatched on a branch, it mutates what the branch changed since
# `base`; on a pull request, what the pull request changed.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: Mutate the changes since this revision, rather than the last day's
        required: false
        default: ""
  # A pull request mutates its own diff.
  pull_request:
    branches: [main]
    paths:
      - "**.rs"
      - .cargo/mutants.toml
      - admin/mutants
      - .github/workflows/mutants.yml

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-latest
            shell: default
            args: --workspace
          - name: aarch64
            os: ubuntu-24.04-arm
            shell: default
            args: --workspace
          # macos-latest is Apple silicon, the only cores rind sets DIT on.
          - name: macos
            os: macos-latest
            shell: default
            args: --workspace
          # Only rind's own code differs on armv7; the adapters' tests run
          # on the other two. `wipe` runs rind/tests/zeroing.rs, which
          # checks each `Drop` that wipes a key.
          - name: armv7
            os: ubuntu-latest
            shell: armv7
            args: --target armv7-unknown-linux-gnueabihf -p rind --features wipe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff's base can lie anywhere in the history.
          fetch-depth: 0

      - uses: ./.github/actions/vectors

      - uses: ./.github/actions/nix

      - name: Diff
        run: |
          if [ -z "$BASE" ]; then
            BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
          fi
          git diff "$(git merge-base "$BASE" HEAD)" HEAD -- '*.rs' > "$RUNNER_TEMP/changes.diff"
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}

      # Exit 2, a missed mutant, may be code only another architecture
      # compiles, so `survivors` decides.
      # macOS mutates only the DIT code, all of it whenever its files
      # changed, since a test change there can let any of its mutants survive.
      - name: Mutate
        run: |
          read -ra args <<<"$ARGS"
          scope=(--in-diff "$RUNNER_TEMP/changes.diff")
          if [ "$RUNNER_OS" = macOS ]; then
            grep -qE '^\+\+\+ b/rind/src/low/(aarch64/)?cpu\.rs$' "$RUNNER_TEMP/changes.diff" || exit 0
            scope=()
          fi
          nix develop ".#$DEV_SHELL" --command admin/mutants "${args[@]}" "${scope[@]}" --output "$RUNNER_TEMP" || [ $? -eq 2 ]
        env:
          DEV_SHELL: ${{ matrix.shell }}
          ARGS: ${{ matrix.args }}

      # The avx512 job mutates the same diff.
      - name: Keep the diff
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mutants.out"
          cp "$RUNNER_TEMP/changes.diff" "$RUNNER_TEMP/mutants.out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.name }}
          path: ${{ runner.temp }}/mutants.out
          retention-days: 14
          if-no-files-found: ignore

  # Retests what the x86_64 run missed, and the files only AVX-512 runs,
  # under SDE's Sapphire Rapids model.
  avx512:
    needs: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/vectors

      - uses: ./.github/actions/nix

      # The dev shell's `sde` runs Intel's binaries in a bubblewrap sandbox,
      # which needs the unprivileged user namespaces Ubuntu's AppArmor denies
      # an unprofiled program.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # `--iterate` skips what this run caught.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-x86_64
          path: ${{ runner.temp }}/mutants.out

      # Copied out of the `mutants.out` that `--iterate` moves aside.
      - name: Mutate
        run: |
          cp "$RUNNER_TEMP/mutants.out/changes.diff" "$RUNNER_TEMP/"
          nix develop .#sde --command admin/mutants --avx512 --workspace --iterate --in-diff "$RUNNER_TEMP/changes.diff" --output "$RUNNER_TEMP" || [ $? -eq 2 ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-avx512
          path: ${{ runner.temp }}/mutants.out
          retention-days: 14
          if-no-files-found: ignore

  # Modules only the portable backend compiles, forced on x86_64 with
  # `--cfg rind_portable`. No feature rows: that backend reads no CPU
  # features. Its own job, rather than a row of the matrix above.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff's base can lie anywhere in the history.
          fetch-depth: 0

      - uses: ./.github/actions/vectors

      - uses: ./.github/actions/nix

      - name: Diff
        run: |
          if [ -z "$BASE" ]; then
            BASE=$(git rev-list -1 --before="24 hours ago" HEAD)
          fi
          git diff "$(git merge-base "$BASE" HEAD)" HEAD -- '*.rs' > "$RUNNER_TEMP/changes.diff"
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}

      # Exit 2, a missed mutant, may be code only another architecture
      # compiles, so `survivors` decides.
      - name: Mutate
        run: |
          nix develop --command admin/mutants --portable -p rind --features wipe --in-diff "$RUNNER_TEMP/changes.diff" --output "$RUNNER_TEMP" || [ $? -eq 2 ]

      - name: Keep the diff
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/mutants.out"
          cp "$RUNNER_TEMP/changes.diff" "$RUNNER_TEMP/mutants.out/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-portable
          path: ${{ runner.temp }}/mutants.out
          retention-days: 14
          if-no-files-found: ignore

  survivors:
    needs: [mutants, avx512, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/mutants

      # One artifact downloads into `mutants` itself, several into a
      # subdirectory each.
      - name: Survivors
        run: |
          shopt -s nullglob
          admin/mutants --survivors "$RUNNER_TEMP"/mutants "$RUNNER_TEMP"/mutants/*/
