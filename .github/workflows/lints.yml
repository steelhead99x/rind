name: quality lints

# aarch64 clippy over every target, which needs an arm64 runner, with the
# flake's pinned tools so a new stable release can't fail it. `just ci`
# already runs x86_64 clippy, both rustfmt checks, `admin/structure`, and the
# MSRV check on every merge.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - rind*/**
      - fuzz/**
      - Cargo.toml
      - Cargo.lock
      - flake.nix
      - flake.lock
      - .github/workflows/lints.yml

permissions:
  contents: read

concurrency:
  group: lints-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # aws-lc-rs's own tests include_str CAVP responses. Clippy compiles
      # every target, so those submodules have to be present.
      - uses: ./.github/actions/vectors

      - name: clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- --deny warnings
