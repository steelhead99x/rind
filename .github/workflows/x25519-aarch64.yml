# One pinned-core measurement for quest/m3/aarch64-x25519.md.
# Not part of the nightly bench: that job shares the runner with every other row.
name: x25519-aarch64

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Record the CPU
        run: |
          {
            echo "nproc=$(nproc)"
            lscpu
            echo "--- affinity of a pinned child ---"
            taskset -c 0 grep -H . /proc/self/status | grep -E 'Cpus_allowed|Pid'
          } | tee cpu.txt

      - name: Build the benchmarks
        run: cargo bench -p rind-bench --bench x25519 --bench ed25519 --features __bench_openssl --no-run

      - name: Measure on one core
        run: |
          taskset -c 0 cargo bench -p rind-bench --bench x25519 --bench ed25519 --features __bench_openssl -- --noplot
          taskset -c 0 grep -E 'Cpus_allowed_list' /proc/self/status | tee -a cpu.txt

      - name: Summarize
        run: |
          find target/criterion -path '*/new/benchmark.json' | sort |
            while read -r f; do
              jq -c --slurpfile e "${f%benchmark.json}estimates.json" \
                '{id: .full_id, ns: ($e[0].slope // $e[0].mean).point_estimate}' "$f"
            done |
            jq -s --arg cpu "$(lscpu | sed -n 's/^Model name: *//p' | head -n1)" \
              --arg commit "$GITHUB_SHA" \
              '{schema: 1, cpu: $cpu, commit: $commit, results: .}' > bench-results.json
          jq -r '.results[] | "\(.ns) \(.id)"' bench-results.json | sort -k2 > bench-results.txt
          cat bench-results.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x25519-aarch64
          path: |
            bench-results.json
            bench-results.txt
            cpu.txt
