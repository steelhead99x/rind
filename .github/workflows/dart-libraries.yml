name: dart-libraries

# Builds the prebuilt libraries rind-dart's Dart package downloads, one per
# target rind supports. From dart-release.yml, which releases and pins what
# this uploads, it builds the package as pub.dev receives it; nightly and on
# demand, the checkout's rind-dart, so a break shows before the release.
# Read-only: releasing is dart-release.yml's.

on:
  schedule:
    - cron: "45 18 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: dart-libraries-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_ZIGBUILD_VERSION: "0.24.1"

jobs:
  # One staged package, so every library and the published package share its
  # lockfile. Only a release stages it: before rind's version is on crates.io,
  # as on a release branch, `cargo package` cannot resolve it.
  package:
    if: inputs.ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - run: sh/dart-package.sh "$RUNNER_TEMP/rind-dart"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rind-dart-package
          path: ${{ runner.temp }}/rind-dart
          if-no-files-found: error

  library:
    name: library (${{ matrix.name }})
    needs: package
    # A release needs the staged package; the nightly skips it.
    if: ${{ !cancelled() && (needs.package.result == 'success' || (!inputs.ref && needs.package.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runner's NDK, at ANDROID_NDK_HOME, links.
          - name: android
            os: ubuntu-latest
            targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          # Zig links against glibc 2.17 from any host.
          - name: linux
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf
            zig: true
          - name: apple
            os: macos-latest
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            targets: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A release builds the staged package, against rind from crates.io as
      # pub.dev's users get it. The nightly builds the checkout's rind-dart
      # against the workspace's rind instead: between releases main's
      # rind-dart uses rind's unreleased API, which crates.io lacks.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.ref
        with:
          name: rind-dart-package
          path: ${{ runner.temp }}/rind-dart

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      # cargo-zigbuild's PyPI package brings zig, which it runs through the
      # python3 its virtual environment puts first on PATH.
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION"
          echo "$RUNNER_TEMP/zig/bin" >>"$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          PACKAGE: ${{ inputs.ref && format('{0}/rind-dart', runner.temp) || 'rind-dart' }}
        run: |
          IFS=, read -ra targets <<<"$TARGETS"
          sh/dart-library.sh "$PACKAGE" "$RUNNER_TEMP/libraries" "${targets[@]}"

      # A release's libraries must be reproducible: built again from a clean
      # target directory at the same paths, which the Apple libraries' install
      # names and the Windows ones' PDB paths record, each matches bit for bit.
      - name: Rebuild and compare
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          PACKAGE: ${{ inputs.ref && format('{0}/rind-dart', runner.temp) || 'rind-dart' }}
        run: |
          IFS=, read -ra targets <<<"$TARGETS"
          rm -rf "$PACKAGE/target"
          sh/dart-library.sh "$PACKAGE" "$RUNNER_TEMP/rebuilt" "${targets[@]}"
          diff -r "$RUNNER_TEMP/libraries" "$RUNNER_TEMP/rebuilt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rind-dart-library-${{ matrix.name }}
          path: ${{ runner.temp }}/libraries
          if-no-files-found: error
