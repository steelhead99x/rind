name: prove

# Checks that the assembly rind imports is the object code its upstream's
# proofs check, and rind's HOL Light proofs in `proofs/hol-light/`,
# cosimulates rind's additions to s2n-bignum's x86 model against the runner's
# CPU, checks that the NEON vectors the Lean proofs test their aarch64
# intrinsic models with are what an aarch64 CPU computes, and translates
# rind's Rust under proof to Lean and checks the proofs in `proofs/`. Too slow
# for `just ci`, so it runs nightly and on pull requests that change rind's
# source, the proofs, the checks, rind's fork of s2n-bignum, or the flake
# that pins their tools.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - rind/src/**
      - proofs/**
      - admin/prove
      - admin/prove-bytes
      - admin/simd-vectors.rs
      - admin/neon-vectors.rs
      - admin/upstream
      - ALGORITHMS.md
      - flake.nix
      - flake.lock
      - thirdparty/s2n-bignum/**
      - .github/workflows/prove.yml

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per target, since each compiles its proofs into its own program
  # and they share only s2n-bignum's model. Each limit is sized from the
  # job's measured time with room for the proofs queued next, as it only
  # catches a hang: on 2026-11-13 aarch64's proofs took 295 to 406 s and
  # x86_64's 1010 to 1079 s, which x86_64 SHA-384/512 on AVX2 takes to about
  # 2000 s.
  hol-light:
    name: hol-light (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            timeout: 20
          - arch: x86_64
            timeout: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # It checks both targets' imported assembly, so one job runs it.
      - name: Bytes
        if: matrix.arch == 'aarch64'
        run: nix develop .#hol-light --command admin/prove bytes

      - name: Prove
        run: nix develop .#hol-light --command admin/prove hol-light ${{ matrix.arch }}

  cosim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Cosimulate
        run: nix develop .#hol-light --command admin/prove cosim

  neon:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Vectors
        run: |
          rustc --edition 2024 -O -o "$RUNNER_TEMP/neon-vectors" admin/neon-vectors.rs
          "$RUNNER_TEMP/neon-vectors" | diff - proofs/Rind/Aarch64/NeonVectors.lean

  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Prove
        run: nix develop .#prove --command admin/prove lean
