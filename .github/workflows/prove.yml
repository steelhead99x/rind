name: prove

# Checks that the assembly rind imports is the object code its upstream's
# proofs check, and rind's HOL Light proofs in `proofs/hol-light/`,
# cosimulates rind's additions to s2n-bignum's x86 model against the runner's
# CPU, cosimulates pyca/verified-garbage's models against the code rind takes
# from it, checks that the NEON vectors the Lean proofs test their aarch64
# intrinsic models with are what an aarch64 CPU computes, and translates
# rind's Rust under proof to Lean and checks the proofs in `proofs/`. Too slow
# for `just ci`, so it runs nightly and on pull requests that change rind's
# source, the proofs, the checks, rind's fork of s2n-bignum, or the flake
# that pins their tools.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - rind/src/**
      - proofs/**
      - admin/prove
      - admin/prove-bytes
      - admin/apple-bytes
      - benchmarks/verified.toml
      - admin/simd-vectors.rs
      - admin/neon-vectors.rs
      - admin/avx512-vectors.rs
      - admin/upstream
      - admin/import-vg
      - admin/import-vg-models
      - admin/vg-bytes
      - admin/vg-cosim-runner.rs
      - ALGORITHMS.md
      - flake.nix
      - flake.lock
      - thirdparty/s2n-bignum/**
      - .github/workflows/prove.yml

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each target's HOL Light proofs run in their own job, so the wall time is
  # the slower target's rather than the sum. Each limit only catches a hang:
  # it sits well above the target's measured time, with room for the proofs
  # queued next, and `admin/prove` prints each proof's time to show where it
  # goes.
  #
  # aarch64's proofs took 2724 s on an Intel Core Ultra 7 270K, 2523 s of
  # them in `bn_mul_mont`, whose 4x path's two column-step lemmas take 930 s
  # each. GitHub's runners took 1.2 to 2.1 times as long as that machine on
  # the other aarch64 proofs, so the job can run about 100 minutes with
  # `admin/prove bytes` and the build.
  hol-light-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Bytes
        run: nix develop .#hol-light --command admin/prove bytes

      - name: Prove
        run: nix develop .#hol-light --command admin/prove hol-light aarch64

  hol-light-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Prove
        run: nix develop .#hol-light --command admin/prove hol-light x86_64

  hol-light-armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Prove
        run: nix develop .#hol-light --command admin/prove hol-light armv7

  cosim:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Cosimulate
        run: nix develop .#hol-light --command admin/prove cosim

  # pyca/verified-garbage's code for each target against VG's Lean models,
  # on the runner's CPU and, for what it lacks, Intel SDE or qemu-aarch64.
  # A pull request runs the fixed seed 1; the nightly and dispatched runs take
  # their run ID as the seed, so each tries new cases.
  vg:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dev shell's `sde` runs Intel's binaries in a bubblewrap sandbox,
      # which needs the unprivileged user namespaces Ubuntu's AppArmor denies
      # an unprofiled program.
      # See UPSTREAM.md, "Ubuntu's AppArmor denies Intel SDE's sandbox".
      - name: Allow user namespaces
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: ./.github/actions/nix

      - name: Cosimulate
        run: nix develop .#vg --command admin/prove vg
        env:
          VG_COSIM_SEED: ${{ github.event_name != 'pull_request' && github.run_id || 1 }}

  neon:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Vectors
        run: |
          rustc --edition 2024 -O -o "$RUNNER_TEMP/neon-vectors" admin/neon-vectors.rs
          "$RUNNER_TEMP/neon-vectors" | diff - proofs/Rind/Aarch64/NeonVectors.lean

  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Prove
        run: nix develop .#prove --command admin/prove lean
