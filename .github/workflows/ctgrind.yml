name: ctgrind

# Weekly, at its own hour: see TESTING.md, "Scheduled workflows".
on:
  schedule:
    - cron: "23 7 * * 6"
  # A dispatch runs every job the schedule runs, unless `jobs` names some,
  # such as `-f jobs='x86_64-sde:rsa4096 armv7:no-neon'`: see
  # sh/select-jobs.sh.
  workflow_dispatch:
    inputs:
      jobs:
        description: Job IDs to run, space-separated, in workflow order, each optionally narrowed to rows as `job:value,...`; empty runs all
        type: string
        default: ""
  # A pull request runs only the x86_64 release row of `build`, the one that
  # fails fastest, and `binsec`; the weekly run runs the rest.
  pull_request:
    # A draft skips every job until it is marked ready, and turning a PR back
    # into a draft cancels its ready run: see CONTRIBUTING.md.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
    paths:
      - rind/src/**
      - rind/Cargo.toml
      - "**/tests/ctgrind.rs"
      - rind-fips/**
      - admin/ctgrind
      - admin/ctgrind.supp
      - admin/esp32c6/**
      - admin/ct-binsec
      - Cargo.lock
      - flake.nix
      - flake.lock
      - .github/workflows/ctgrind.yml

permissions:
  contents: read

# Dispatches naming different jobs run side by side.
concurrency:
  group: ctgrind-${{ github.ref }}-${{ inputs.jobs }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VALGRIND_BUG_494162: 1

jobs:
  # Checks a dispatch's `jobs` and hands each job its part, which its `if:`
  # and its matrix's `exclude` read; every other job needs it, so a run
  # without `jobs` skips it and runs them all.
  select:
    if: inputs.jobs
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      exclude: ${{ steps.select.outputs.exclude }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/ctgrind.yml
            sh/select-jobs.sh
          sparse-checkout-cone-mode: false

      - id: select
        run: |
          selected=$(sh/select-jobs.sh .github/workflows/ctgrind.yml "$JOBS")
          tee -a "$GITHUB_OUTPUT" <<<"$selected"
        env:
          JOBS: ${{ inputs.jobs }}

  # Valgrind hides SHA3 and SVE2 from aarch64 programs, so the arm64 rows
  # check the code for cores with the crypto extension but without either,
  # and say so; `aarch64-qemu` checks the SHA3 and SVE2 paths. x86_64
  # ignores the variables.
  # release-plz's release PR, which only bumps versions and changelogs, runs
  # neither this nor `binsec`: a `release-plz-` branch that moq-bot,
  # release.yml's app, opened.
  build:
    needs: select
    if: ${{ !cancelled() && !github.event.pull_request.draft && !(startsWith(github.head_ref, 'release-plz-') && github.event.pull_request.user.login == 'moq-bot[bot]') && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'build')) }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        build: [debug, release]
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"ubuntu-24.04-arm"},{"build":"debug"}]') || fromJSON(needs.select.outputs.exclude || '{}').build || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    env:
      RIND_TEST_ARM_CRYPTO_EXT: 1
      RIND_TEST_ARM_SHA3: 0
      RIND_TEST_ARM_SVE2: 0
      # A pull request whose change reaches no backend this job builds skips it.
      RIND_SCOPE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/nix

      # Only for the row pull requests run.
      - uses: ./.github/actions/rust-cache
        if: matrix.os == 'ubuntu-latest' && matrix.build == 'release'
        with:
          shell: .#ctgrind

      - name: ctgrind tests
        run: nix develop .#ctgrind --command admin/ctgrind ${{ matrix.build == 'release' && '--release' || '' }}
      - name: ctgrind FIPS module tests
        run: nix develop .#ctgrind --command admin/ctgrind fips ${{ matrix.build == 'release' && '--release' || '' }}
      # The suite forces the portable backend and `--release` itself, so the
      # debug row has nothing more to check.
      - name: ctgrind ESP32-C6 sensor tests
        if: ${{ matrix.build == 'release' }}
        run: nix develop .#ctgrind --command admin/ctgrind esp32c6

  # Valgrind hides ADX, which `admin/ctgrind`'s build switch overrides to
  # check s2n-bignum's ADX routines, so this job denies it to check what
  # CPUs without ADX run: their `_alt` twins, and aws-lc's Montgomery
  # multiplication for RSA. The `no-adx` row keeps AVX2, as Haswell does, for
  # aws-lc's RSAZ exponentiation of RSA-2048. The `no-avx2` row denies AVX2
  # and MOVBE, for what Sandy Bridge runs: the `no-avx` row's code, but
  # rind's AES-GCM and GHASH intrinsics VEX-encoded. GitHub's runners are
  # AMD's, so Intel's AVX SHA-1, SHA-256, and SHA-512 run only in their
  # `paths_match` tests, which each row with AVX runs on secret blocks.
  # The `no-avx` row denies AVX and
  # the vendor too, for what CPUs such as Westmere run: aws-lc's SSE4.1
  # ChaCha20-Poly1305 and SSSE3 ChaCha20, SHA-1, and SHA-256, the portable
  # ML-KEM arithmetic, the SSE2 selects, rind's AES-GCM and GHASH intrinsics
  # without VEX encoding, and aws-lc's AES-NI CTR. The `no-aes` row also
  # denies AES-NI, PCLMULQDQ, and SSE4.1, for aws-lc's vpaes and SSSE3 GHASH,
  # and ChaCha20 and Poly1305 in separate passes, as the first Core 2s run,
  # and the `no-ssse3` row SSSE3, for aws-lc's SSE2 AES, integer GHASH,
  # SHA-1, and SHA-256, and HACL*'s ChaCha20 rounds, as `qemu64` runs. Valgrind already hides
  # VAES and the SHA extensions, so their denials only keep each row the CPU
  # it names. The denial takes `--cfg rind_cpu_disable`, so the release build
  # stays the code that ships.
  x86_64-portable:
    name: x86_64-portable (${{ matrix.cpu }})
    needs: select
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'x86_64-portable')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: no-adx
            deny: RIND_CPU_DISABLE_vaes=1 RIND_TEST_X86_AVX2=1 RIND_TEST_X86_VAES_AES_GCM=0 RIND_TEST_X86_AVX_MOVBE_AES_GCM=1
          - cpu: no-avx2
            deny: RIND_CPU_DISABLE_avx2=1 RIND_CPU_DISABLE_movbe=1 RIND_TEST_X86_AVX2=0 RIND_TEST_X86_AVX=1 RIND_TEST_X86_AVX_MOVBE_AES_GCM=0 RIND_TEST_X86_AES_HARDWARE=1 RIND_TEST_X86_SSE41=1
          - cpu: no-avx
            deny: RIND_CPU_DISABLE_avx=1 RIND_CPU_DISABLE_intel=1 RIND_CPU_DISABLE_sha=1 RIND_TEST_X86_AVX=0 RIND_TEST_X86_AVX2=0 RIND_TEST_X86_AES_HARDWARE=1 RIND_TEST_X86_SSE41=1
          - cpu: no-aes
            deny: RIND_CPU_DISABLE_avx=1 RIND_CPU_DISABLE_intel=1 RIND_CPU_DISABLE_sha=1 RIND_CPU_DISABLE_aes=1 RIND_CPU_DISABLE_pclmulqdq=1 RIND_CPU_DISABLE_sse41=1 RIND_TEST_X86_AVX=0 RIND_TEST_X86_AVX2=0 RIND_TEST_X86_AES_HARDWARE=0 RIND_TEST_X86_SSE41=0
          - cpu: no-ssse3
            deny: RIND_CPU_DISABLE_ssse3=1 RIND_TEST_X86_SSSE3=0 RIND_TEST_X86_SSE41=0 RIND_TEST_X86_AVX=0 RIND_TEST_X86_AVX2=0 RIND_TEST_X86_AES_HARDWARE=0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # A denial set to any value takes effect, so a row's extra variables
      # are words for `env`.
      - name: ctgrind tests
        run: |
          read -ra deny <<< "$DENY"
          nix develop .#ctgrind --command env "${deny[@]}" admin/ctgrind --release
        env:
          RUSTFLAGS: --cfg rind_cpu_disable
          DENY: ${{ matrix.deny }}
          RIND_CPU_DISABLE_adx: 1
          RIND_TEST_X86_BMI2_ADX: 0

  # The portable backend, forced on x86_64 as `just portable` forces it, with
  # dalek's serial backend, which the architectures that need it run. Its
  # public-key arithmetic runs on 64-bit limbs there, so the `32` row forces
  # the 32-bit limbs 32-bit targets run.
  portable:
    name: portable (${{ matrix.limb }}-bit limbs)
    needs: select
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'portable')) }}
    strategy:
      fail-fast: false
      matrix:
        limb: ["64", "32"]
        exclude: ${{ fromJSON(needs.select.outputs.exclude || '{}').portable || fromJSON('[]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: ctgrind tests
        run: nix develop .#ctgrind --command admin/ctgrind --release
        env:
          RUSTFLAGS: --cfg rind_portable --cfg curve25519_dalek_backend="serial" --cfg rind_limb="${{ matrix.limb }}"

  # Valgrind runs no AVX-512, VAES, VPCLMULQDQ, or SHA instruction, so
  # `admin/ct-sde` compares Intel SDE traces of those paths for two secrets
  # instead. One job per test, since RSA-4096's traces alone take about an
  # hour.
  x86_64-sde:
    name: x86_64-sde (${{ matrix.test }})
    needs: select
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'x86_64-sde')) }}
    strategy:
      fail-fast: false
      matrix:
        test: [rsa3072, rsa4096, crt_ifma_2048, crt_ifma512_2048, crt_ifma512_3072, crt_ifma_4096, crt_ifma512_4096, public_ifma, aes128_gcm, aes192_gcm, aes256_gcm, aes_gcm_vaes_avx2, hmac, chacha20, mlkem768, x25519, ed25519, p256_ifma_ecdh]
        exclude: ${{ fromJSON(needs.select.outputs.exclude || '{}')['x86_64-sde'] || fromJSON('[]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # As in x86-cpu.yml, for the dev shell's SDE sandbox.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: ct-sde
        run: nix develop .#sde --command admin/ct-sde ${{ matrix.test }}

  # The arm64 runner's core has the crypto extension, so this job denies it
  # to check vpaes, NEON GHASH, and the scalar SHA-1 and SHA-256 that cores
  # without it run. The denial takes `--cfg rind_cpu_disable`, as above.
  aarch64-portable:
    needs: select
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'aarch64-portable')) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: ctgrind tests
        run: nix develop .#ctgrind --command admin/ctgrind --release
        env:
          RUSTFLAGS: --cfg rind_cpu_disable
          RIND_CPU_DISABLE_aes: 1
          RIND_CPU_DISABLE_pmull: 1
          RIND_CPU_DISABLE_sha2: 1
          RIND_TEST_ARM_CRYPTO_EXT: 0
          RIND_TEST_ARM_SHA3: 0
          RIND_TEST_ARM_SVE2: 0

  # The arm64 runner executes 32-bit ARM natively, so an armhf valgrind checks
  # the armv7 build without emulation. Its core has NEON and the crypto
  # extension, but valgrind hides `AT_HWCAP2` from the program, so the NEON
  # code is checked here and the extension's by `armv7-qemu` (see
  # `admin/ctgrind`).
  #
  # Release and debug builds, as `build` checks, each suite its own job.
  #
  # The `no-neon` rows run the unit suite with NEON denied, to check the code
  # cores without it run, such as OpenSSL's integer Keccak-f. The denial takes
  # `--cfg rind_cpu_disable`, as above.
  #
  # The debug unit rows take about two hours, the rest under one.
  #
  # Ubuntu's armhf valgrind rather than `devShells.ctgrind`: nixpkgs caches no
  # armhf valgrind for an arm64 host, and building it builds its gdb too.
  armv7:
    name: armv7 (${{ matrix.suite }}, ${{ matrix.build }})
    needs: select
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'armv7')) }}
    strategy:
      # One suite's failure says nothing about the others.
      fail-fast: false
      matrix:
        suite: [unit, no-neon, wycheproof, adapters]
        build: [debug, release]
        exclude: ${{ fromJSON(needs.select.outputs.exclude || '{}').armv7 || fromJSON('[]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf

      - name: Install armhf toolchain and valgrind
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6:armhf valgrind:armhf

      # The dev shell's version, as a checksum-verified prebuilt.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.149

      # A denial set to any value takes effect, so only the `no-neon` rows set
      # one.
      - name: ctgrind tests
        run: |
          suite=$SUITE
          if [ "$suite" = no-neon ]; then
            suite=unit
            export RIND_CPU_DISABLE_neon=1 RUSTFLAGS='--cfg rind_cpu_disable'
          fi
          admin/ctgrind "$suite" --target armv7-unknown-linux-gnueabihf ${{ matrix.build == 'release' && '--release' || '' }}
        env:
          SUITE: ${{ matrix.suite }}
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          RIND_TEST_ARM_NEON: ${{ matrix.suite == 'no-neon' && '0' || '1' }}
          RIND_TEST_ARM_CRYPTO_EXT: 0

  # Valgrind hides armv7's crypto extension, so `admin/ct-qemu` compares
  # qemu-arm traces of its AES, GHASH, SHA-1, and SHA-256 for two secrets
  # instead, as `x86_64-sde` does with SDE.
  armv7-qemu:
    needs: select
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'armv7-qemu')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: ct-qemu
        run: nix develop .#ct-qemu --command admin/ct-qemu

  # Valgrind hides SHA3 and SVE2 from aarch64 programs too, so what rind
  # runs only with them never runs under ctgrind: the eight-way AES-GCM
  # kernels, the SHA-512 instructions, the SHA3 Keccak kernels, and
  # pyca/verified-garbage's SVE2 ChaCha20-Poly1305. `admin/ct-qemu`
  # traces them under qemu-aarch64 instead, natively built on the arm64
  # runner.
  aarch64-qemu:
    needs: select
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'aarch64-qemu')) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: ct-qemu
        run: nix develop .#ct-qemu-aarch64 --command admin/ct-qemu --target aarch64-unknown-linux-gnu

  # BINSEC proves each `ct_binsec` test's region constant time for every
  # secret at once, symbolically, on the code the runner's CPU takes short of
  # the instructions it cannot decode (see `admin/ct-binsec`). The portable
  # row forces the portable backend, as the `portable` job does. armv7 is
  # left to valgrind and `admin/ct-qemu`: BINSEC decodes none of its NEON
  # table lookups or crypto extension.
  binsec:
    name: binsec (${{ matrix.backend }})
    needs: select
    if: ${{ !cancelled() && !github.event.pull_request.draft && !(startsWith(github.head_ref, 'release-plz-') && github.event.pull_request.user.login == 'moq-bot[bot]') && (!inputs.jobs || contains(fromJSON(needs.select.outputs.jobs || '[]'), 'binsec')) }}
    strategy:
      fail-fast: false
      matrix:
        backend: [x86_64, portable, aarch64]
        exclude: ${{ fromJSON(needs.select.outputs.exclude || '{}').binsec || fromJSON('[]') }}
    runs-on: ${{ matrix.backend == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: ct-binsec
        run: nix develop .#binsec --command admin/ct-binsec --timeout 480
        env:
          RUSTFLAGS: ${{ matrix.backend == 'portable' && '--cfg rind_portable --cfg curve25519_dalek_backend="serial"' || '' }}
