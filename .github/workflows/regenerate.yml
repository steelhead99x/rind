name: regenerate

# Re-runs every importer and generator at the upstream revision it pins and
# fails on any difference from the committed code, or on an unlisted change in
# rind's fork of s2n-bignum. Nightly; the merge queue's build runs it too when
# a group changes a generator, a pin, the fork, or the flake that pins its
# tools (`CHECK_QUEUE` in sh/dispatch.sh).
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Regenerate
        run: nix develop .#regenerate --command admin/regenerate
