# Builds RindBench's iOS app (rind-devbench/ios) on a hosted Mac, unsigned,
# and keeps the .ipa as an artifact to sign and install on an iPad.
name: devbench iOS

on:
  push:
    branches: ["devbench/**"]
    paths: ["rind-devbench/**", ".github/workflows/devbench-ios.yml"]
  workflow_dispatch:
    inputs:
      port:
        description: Collector port baked into the app
        default: "9101"
      host:
        description: Collector LAN address baked into the app (empty keeps results on the device)
        default: ""

permissions:
  contents: read

jobs:
  ipa:
    name: Build the unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1 for aarch64-apple-ios
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
          rustc +1.98.1 --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build
        env:
          PORT: ${{ inputs.port || '9101' }}
          HOST: ${{ inputs.host || '' }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/devbench-target
        run: rind-devbench/ios/build-ipa.sh "$PORT" "$HOST"

      - name: Check the app
        run: |
          ipa=$(ls rind-devbench/ios/out/*.ipa)
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app="$RUNNER_TEMP/ipa/Payload/RindBenchAll.app"
          lipo -info "$app/RindBenchAll"
          plutil -p "$app/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|BenchPort|MinimumOSVersion'
          test -d "$app/keys"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RindBenchAll-ipa
          path: rind-devbench/ios/out/*.ipa
          if-no-files-found: error
          retention-days: 14
