name: Queue build

# The merge queue's build of a group, on the host's self-hosted runner, and
# rind's tests on aarch64 Linux, on the Mac mini's runner (a VM
# admin/mac-mini-runners sets up). Only queue.yml calls it. Once queue.yml
# calls it at main and the rind-queue runner group, which holds both runners,
# admits only this workflow at refs/heads/main, no other workflow can
# reach the runners, an approved fork run's included; a PR's edit to this file
# then runs only after it lands. For the same reason it uses no local action:
# main's copy runs against every group's tree, so a PR that moved or deleted one
# could not land. The tree's own setup belongs in `just ci`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Its context, `Queue build / Build`, is one main's ruleset requires, so
  # the group's result is this job's own: a failed, cancelled, or timed-out
  # build fails the group with no job after it waiting on a hosted runner.
  build:
    name: Build
    # A caller's own event decides this. On a pull request the job skips
    # without a runner, which reports the required context as passed so GitHub
    # admits the PR to the queue.
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, rind-queue]
    # Below the queue's 90-minute response window, so a hung build reports
    # before the group expires.
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
      # A failure ejects the group whatever else fails, so stop at the first.
      CHECK_FAIL_FAST: 1
      # Only the host's Rust checks and the quick lints, leaving the PR
      # check's slower modules to it and check.yml's nightly run, since every
      # group waits on this build.
      CHECK_QUEUE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check and test the merge group
        # Every group waits on this build, so it waits only for memory, never
        # behind the host's agent load.
        env:
          QUEST_GATE_PRIORITY: 1
        run: nix develop --command quest gate just ci "$BASE"
      # Cargo's per-crate timings of the group's build, so a compile-time
      # regression shows without profiling by hand. A diagnostic, so a failed
      # upload never fails the group.
      - name: Upload build timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing-*.html
          if-no-files-found: ignore
          retention-days: 14

  # The x86_64 build above runs the tests only on x86_64, so this runs them
  # natively on aarch64, where rind runs its own assembly and dispatch, which
  # two PRs can break together. It runs only the `rs` module, whose result
  # depends on the host; the lints and other targets' builds do not. It reports
  # its own context, which main's ruleset requires, as it does `Build`'s. A
  # macOS-only break two PRs make together shows first in the nightly `build`.
  linux-aarch64:
    name: Build aarch64 Linux
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, rind-queue-linux]
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
      CHECK_FAIL_FAST: 1
      CHECK_MODULES: rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the merge group
        env:
          QUEST_GATE_PRIORITY: 1
        run: nix develop --command quest gate just ci "$BASE"
