name: Queue build

# The merge queue's build of a group, on the host's self-hosted runner. Only
# queue.yml calls it. Once queue.yml calls it at main and the rind-queue runner
# group admits only this workflow at refs/heads/main, no other workflow can
# reach the runner, an approved fork run's included; a PR's edit to this file
# then runs only after it lands. For the same reason it uses no local action:
# main's copy runs against every group's tree, so a PR that moved or deleted one
# could not land. The tree's own setup belongs in `just ci`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Its context, `Queue build / Build`, is the one main's ruleset requires, so
  # the group's result is this job's own: a failed, cancelled, or timed-out
  # build fails the group with no job after it waiting on a hosted runner.
  build:
    name: Build
    # A caller's own event decides this. On a pull request the job skips
    # without a runner, which reports the required context as passed so GitHub
    # admits the PR to the queue.
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, rind-queue]
    # Below the queue's 90-minute response window, so a hung build reports
    # before the group expires: the build step's 60 minutes (this job's whole
    # limit before) plus the slow SDE models step's 25 is 85, which leaves only
    # 5 of the 90 minutes.
    timeout-minutes: 85
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
      # A failure ejects the group whatever else fails, so stop at the first.
      CHECK_FAIL_FAST: 1
      # Also `regenerate` and `prove`'s x86_64 `vg` when the group touches
      # their paths, beside the other modules. They run here rather than on
      # GitHub-hosted runners, whose queue waits (46 minutes at p90 in
      # November 2026) would run into this job's timeout.
      CHECK_QUEUE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check and test the merge group
        timeout-minutes: 60
        # Every group waits on this build, so it waits only for memory, never
        # behind the host's agent load.
        env:
          QUEST_GATE_PRIORITY: 1
        run: nix develop --command quest gate just ci "$BASE"
      # The SDE models x86-cpu.yml's merge-group jobs leave out, `slow` in
      # admin/x86-cpu, run one after the other when the group reaches x86_64.
      # Not required: this host is not confirmed to run Intel SDE (its
      # bubblewrap sandbox needs unprivileged user namespaces), so a failure,
      # a missing SDE, or the 25-minute timeout leaves the job green, and the
      # build above alone decides `Queue build / Build`. The failure shows in
      # this step's log and annotation. Drop `continue-on-error` once the host
      # is confirmed and the models' time on it is measured.
      #
      # The 25 minutes is an unmeasured guess, and probably too short: on
      # hosted runners the two models took 50.8 and 46.7 minutes each, and they
      # run one after the other after the archive build, so on hosted-class
      # hardware they are expected to exceed it. Until the host's time is
      # measured this step is not coverage: it will likely time out, green.
      - name: Slow SDE models (not required)
        continue-on-error: true
        timeout-minutes: 25
        env:
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # x86-cpu.yml's `scope` skips a release PR, which bumps only
          # versions and changelogs. sh/backends.sh does not: Cargo.toml and
          # Cargo.lock reach every backend. A failed lookup runs the step.
          if [[ "$GROUP_REF" =~ /pr-([0-9]+)- ]]; then
            pr=$(gh api "repos/$REPO/pulls/${BASH_REMATCH[1]}" --jq '"\(.head.ref) \(.user.login)"' || true)
            if [[ "$pr" == release-plz-*' moq-bot[bot]' ]]; then echo "A release PR."; exit 0; fi
          fi
          changed=$(sh/changed.sh "$BASE")
          if ! grep -qE '^(\.github/workflows/x86-cpu\.yml|admin/x86-cpu)$' <<<"$changed"; then
            reach=$(sh/backends.sh - <<<"$changed")
            grep -qxE 'all|x86_64' <<<"$reach" || { echo "The group reaches no x86_64 code."; exit 0; }
          fi
          nix develop .#sde --command admin/x86-cpu queue-slow
