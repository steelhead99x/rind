name: Queue build

# The merge queue's build of a group, on the host's self-hosted runner. Only
# queue.yml calls it. Once queue.yml calls it at main and the rind-queue runner
# group admits only this workflow at refs/heads/main, no other workflow can
# reach the runner, an approved fork run's included; a PR's edit to this file
# then runs only after it lands. For the same reason it uses no local action:
# main's copy runs against every group's tree, so a PR that moved or deleted one
# could not land. The tree's own setup belongs in `just ci`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Its context, `Queue build / Build`, is the one main's ruleset requires, so
  # the group's result is this job's own: a failed, cancelled, or timed-out
  # build fails the group with no job after it waiting on a hosted runner.
  build:
    name: Build
    # A caller's own event decides this. On a pull request the job skips
    # without a runner, which reports the required context as passed so GitHub
    # admits the PR to the queue.
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, rind-queue]
    # Below the queue's 90-minute response window, so a hung build reports
    # before the group expires.
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
      # A failure ejects the group whatever else fails, so stop at the first.
      CHECK_FAIL_FAST: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check and test the merge group
        # Every group waits on this build, so it waits only for memory, never
        # behind the host's agent load.
        env:
          QUEST_GATE_PRIORITY: 1
        run: nix develop --command quest gate just ci "$BASE"

  # DRAFT, not for landing before the runners below exist. Labels: GitHub gives
  # every runner its OS and architecture labels itself, so one custom label,
  # `rind-queue-arm64`, marks the aarch64 queue runners and `macOS` or `Linux`
  # picks between them. `rind-queue` stays the x86_64 host's alone, so the job
  # above can never be handed to an arm64 runner. The same
  # group build on the Mac mini, natively on macOS and on aarch64 Linux in a
  # VM on the same machine, so a pair of PRs that each pass x86_64 alone but
  # break aarch64 together never reach main. Each job's context, `Queue build /
  # Build (macOS)` and `Queue build / Build (aarch64 Linux)`, joins the
  # required contexts in dotfiles' repo-settings only after its runner has
  # passed a group, so a group never waits on a runner that is not there.
  build-macos:
    name: Build (macOS)
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, rind-queue-arm64, macOS]
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
      CHECK_FAIL_FAST: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check and test the merge group
        env:
          QUEST_GATE_PRIORITY: 1
        run: nix develop --command quest gate just ci "$BASE"

  build-linux-arm64:
    name: Build (aarch64 Linux)
    if: github.event_name == 'merge_group'
    runs-on: [self-hosted, rind-queue-arm64, Linux]
    timeout-minutes: 60
    env:
      BASE: ${{ github.event.merge_group.base_sha }}
      CHECK_FAIL_FAST: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check and test the merge group
        env:
          QUEST_GATE_PRIORITY: 1
        run: nix develop --command quest gate just ci "$BASE"
