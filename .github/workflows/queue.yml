name: Queue

# GitHub's merge queue tests each picked PR on top of main, one at a time, on
# the self-hosted runners, and merges exactly the tree it tested. When the
# queue drops a PR, kixel-ai/quest's queue watcher on the x86_64 host runs
# the land fixer and re-enqueues it at the back of the queue.
#
# `main`'s ruleset requires the build's context, `Queue build / Build`, and
# will require its aarch64 jobs' `Queue build / Build aarch64 macOS` and
# `Queue build / Build aarch64 Linux` once one merge group has passed both
# (quest/m0/mac-mini-runner.md); until then they report but gate nothing.
# GitHub admits a PR to the queue only once its required checks pass on the PR
# itself, so the build also reports, as skipped, on main pull requests; a
# skipped job satisfies the requirement.
# Only the merge group build runs code, and only a maintainer's pick enters
# the queue.
on:
  pull_request:
    branches: [main]
    # `edited` covers a PR retargeted to main, which needs the context too.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  # Reports the skipped context on a PR's head without a pull_request event.
  # A PR whose test merge commit predates this workflow gets no pull_request
  # run from it (GitHub runs PR workflows from that commit, and a dispatch reads
  # the workflow from the ref it runs on), so
  # `gh workflow run queue.yml -f sha=<head>` on main reports it there.
  workflow_dispatch:
    inputs:
      sha:
        description: The PR head commit to report the skipped required context on.
        required: true

permissions:
  contents: read

# No concurrency group. Cancelling a pull request's run before its build job
# skips, as a second event for the PR would, reports the required context
# cancelled and fails the requirement; even a group without
# cancel-in-progress cancels a pending run. Each merge group has its own ref, so
# its run never had another to replace, and a repeated dispatch only reports the
# same skipped context twice.

jobs:
  # The build runs in queue-build.yml so its runner group can admit that
  # workflow alone; see that file. It calls main's copy, not the merge group's,
  # since the group admits that workflow only at refs/heads/main: a PR's edit to
  # queue-build.yml runs only after it lands.
  #
  # Its jobs report `Queue build / Build` and the aarch64 contexts, which
  # main's ruleset requires (the aarch64 two once a group has passed them),
  # with no job after them waiting on a hosted runner. The call runs on pull
  # requests too, where that job skips without a runner; a call skipped here
  # would report no context at all.
  build:
    name: Queue build
    if: github.event_name != 'workflow_dispatch'
    uses: kixel-ai/rind/.github/workflows/queue-build.yml@main

  # The merge queue still builds every group with the job above; this only
  # satisfies the PR-side requirement, as a pull_request run's skipped job does.
  report:
    name: Report Queue
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Report the skipped required contexts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit SHA" >&2; exit 1; }
          for name in 'Queue build / Build' 'Queue build / Build aarch64 macOS' 'Queue build / Build aarch64 Linux'; do
            gh api "repos/$REPO/check-runs" -f "name=$name" -f head_sha="$SHA" -f status=completed -f conclusion=skipped \
              -f "output[title]=$name" -f 'output[summary]=Skipped on the pull request; the merge queue builds the group.' --silent
          done
