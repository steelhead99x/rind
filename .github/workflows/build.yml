name: build

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # rind-fips's module answers ACVP's sets through rind-acvp on each of the
  # runner's paths, with the large-data hash tests, 15 GiB a hash, which run
  # only with SLOW_TESTS. x86-cpu.yml covers the AVX-512 paths under SDE.
  acvp:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Answer ACVP's sets
        run: nix develop .#acvp --command cargo test --release -p rind-acvp --features module --locked
        env:
          SLOW_TESTS: 1

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rustc: stable
          - os: ubuntu-latest
            rustc: nightly
          # macos-latest is aarch64; macos-15-intel is the x86_64 runner.
          - os: macos-latest
            rustc: stable
          - os: macos-15-intel
            rustc: stable
          - os: windows-latest
            rustc: stable
          - os: windows-11-arm
            rustc: stable
          - os: ubuntu-24.04-arm
            rustc: stable

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ${{ matrix.rustc }} toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rustc }}

      - name: Build (debug)
        run: cargo build -p rind
      - name: Run tests (debug)
        run: cargo test
      - name: Run tests (debug, --no-default-features)
        run: cargo test --no-default-features

      - name: Build (release)
        run: cargo build -p rind --release
      - name: Run tests (release)
        run: env SLOW_TESTS=1 cargo test --release
      # Each self-test's failure, and on every call, that each service's
      # stack stays within what it zeroes.
      - name: Run FIPS break tests
        if: runner.os == 'Linux'
        run: cargo test -p rind-fips --features __break_tests

      # Each tier runs the tests, then CCTV's million ML-KEM vectors in a
      # release build, which honours the tier's denials only with
      # `--cfg rind_cpu_disable`, alongside the check that they took effect.
      # rind-fips is left out: its module refuses a CPU masked below its
      # baseline.
      - name: Artificial CPU feature tests
        shell: bash
        run: |
          sh/cpu-tiers.sh cargo test --workspace --exclude rind-fips
          SLOW_TESTS=1 RUSTFLAGS='--cfg rind_cpu_disable' sh/cpu-tiers.sh cargo test --release -p rind --lib -- cctv_accumulated detects_the_expected_cpu

  # musl runs the glibc build's code, so these test the packages consumers
  # link, without the CPU feature passes. The bench and fuzz crates need C++
  # built for musl, which musl-tools lacks.
  musl:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # The tests' aws-lc-rs dev-dependency builds C for the target.
      - name: Install musl-gcc
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo "CC_${CARGO_BUILD_TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Run tests (debug)
        run: cargo test -p rind -p rind-rustls -p rind-jsonwebtoken -p rind-object-store -p rind-rcgen -p rind-rand-core -p rind-ring -p rind-aws-lc-rs -p rind-dimpl -p rind-openmls -p rind-str0m
      - name: Run tests (release)
        run: env SLOW_TESTS=1 cargo test -p rind -p rind-rustls -p rind-jsonwebtoken -p rind-object-store -p rind-rcgen -p rind-rand-core -p rind-ring -p rind-aws-lc-rs -p rind-dimpl -p rind-openmls -p rind-str0m --release

  # 32-bit x86 Windows on the portable backend, which the x86_64 runner runs
  # natively. The qemu job tests Linux's, and the android job Android's.
  i686-windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_TARGET: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc

      - name: Run tests (debug)
        run: cargo test -p rind -p rind-rustls -p rind-jsonwebtoken -p rind-object-store -p rind-rcgen -p rind-rand-core -p rind-ring -p rind-aws-lc-rs -p rind-dimpl -p rind-openmls -p rind-str0m --locked
      - name: Run tests (release)
        run: env SLOW_TESTS=1 cargo test -p rind -p rind-rustls -p rind-jsonwebtoken -p rind-object-store -p rind-rcgen -p rind-rand-core -p rind-ring -p rind-aws-lc-rs -p rind-dimpl -p rind-openmls -p rind-str0m --locked --release

  # 32-bit ARM runs libcrux, or aws-lc's assembly for ChaCha20, NEON, and the
  # crypto extension. The recipe builds and lints Android and Linux gnueabihf,
  # then runs the gnueabihf tests on each of rind's armv7 tiers, as a local
  # run does: the arm64 runner runs the crypto extension's tier and the
  # NEON-denied one natively, and qemu the Cortex-A15's.
  armv7:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/rust-cache
        with:
          shell: .#armv7

      - name: Build, lint, and test
        run: just armv7

  # wasm32-wasip2 on the portable backend, under wasmtime: rind's vector tests
  # and rind-rustls's and rind-ring's tests, without the differential ones,
  # whose aws-lc does not build for wasm; then the adapters' tests on
  # wasm32-unknown-unknown in Node.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just
      - uses: ./.github/actions/nix

      - name: Build and test
        run: just wasm

  # Targets with no rind assembly, on the portable backend, under qemu-user
  # where the runner cannot run them natively. Each entry names the flake dev
  # shell that holds its target's toolchain. s390x, powerpc64, and powerpc are
  # big-endian, the armv6 shells run on qemu's ARM1176, and the runner runs
  # i686 natively.
  qemu:
    strategy:
      fail-fast: false
      matrix:
        shell: [s390x, riscv64, riscv64-musl, loongarch64, armv6, armv6-softfloat, powerpc64le, powerpc64, powerpc, i686]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just
      - uses: ./.github/actions/nix

      - name: Build, lint, and test
        run: just qemu ${{ matrix.shell }}

  # rind-dart's Dart package on each host Dart and Flutter build on. Its tests
  # run natively, and its build hook cross-builds the mobile targets, whose
  # libraries the hook's test checks are for the right architecture.
  dart:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
            cross: android-arm64,android-arm,android-x64
          - os: ubuntu-24.04-arm
          - os: macos-latest
            targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
            cross: ios-arm64-iphoneos,ios-arm64-iphonesimulator,ios-x64-iphonesimulator
          - os: macos-15-intel
          - os: windows-latest
          - os: windows-11-arm

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rind-dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - run: dart pub get

      # The Android builds link with the runner's NDK, at ANDROID_NDK_HOME.
      - name: Run tests
        env:
          RIND_DART_CROSS_TARGETS: ${{ matrix.cross }}
        run: dart test

      # rind_cryptography is Dart over the rind package, whose FFI the steps
      # above test on every host, so one host runs its tests and the
      # cryptography package's own.
      - name: Run rind_cryptography's tests
        if: matrix.os == 'ubuntu-latest'
        working-directory: rind-dart/cryptography
        run: |
          dart pub get
          dart test
          dart run tool/upstream_test.dart

  # rind-dart's tests on an Android emulator, through the Flutter app in
  # rind-dart/integration. The x86_64 image runs x86_64 natively, and armv7,
  # for its 32-bit pointers, under its ARM translation.
  dart-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rind-dart/integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-linux-android,armv7-linux-androideabi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create the Android project
        run: flutter create --platforms android .

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          working-directory: rind-dart/integration
          script: |
            flutter test integration_test -d emulator-5554
            ./android-arm.sh

  # rind-dart's tests on the iOS simulator, through the same Flutter app.
  dart-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rind-dart/integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim

      # Beta, not stable: stable 3.50.0's `flutter test` sometimes misses the
      # app's VM service URL and hangs. See UPSTREAM.md, "Flutter's iOS
      # simulator test run hangs when its log stream attaches late".
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: beta

      - name: Create the iOS project
        run: flutter create --platforms ios .

      - name: Run tests
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          flutter test integration_test -d "$udid"

  # The portable backend, which every architecture without rind assembly
  # runs, forced on x86_64 so it runs without emulation. The recipe lints and
  # tests it with the checks a debug build has.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/rust-cache

      - name: Build, lint, and test
        run: just portable

  # openmls's own tests and vectors, run on rind-openmls in place of the
  # openmls_rust_crypto it mirrors.
  openmls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/rust-cache

      - name: Test
        run: just openmls --release

  # The simulator runs the iOS tests natively on the Apple silicon runner;
  # devices' code is only built, since GitHub has no iOS device to run it.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # aws-lc-rs's C, which the tests link, targets the SDK's own iOS
      # version unless told otherwise, and then needs symbols rustc's
      # default iOS version lacks; this gives both rustc's default.
      # See UPSTREAM.md, "aws-lc-sys targets the SDK's iOS version".
      - name: Build tests (device)
        run: |
          export "$(rustc --print deployment-target --target aarch64-apple-ios)"
          cargo test -p rind -p rind-rustls -p rind-jsonwebtoken -p rind-object-store -p rind-rcgen -p rind-rand-core -p rind-ring -p rind-aws-lc-rs -p rind-dimpl -p rind-openmls -p rind-str0m --target aarch64-apple-ios --no-run

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      - name: Run tests (simulator)
        env:
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER: ${{ github.workspace }}/sh/ios-simulator.sh
          RIND_TEST_ARM_CRYPTO_EXT: 1
        run: |
          export "$(rustc --print deployment-target --target aarch64-apple-ios-sim)"
          cargo test -p rind -p rind-rustls -p rind-jsonwebtoken -p rind-object-store -p rind-rcgen -p rind-rand-core -p rind-ring -p rind-aws-lc-rs -p rind-dimpl -p rind-openmls -p rind-str0m --target aarch64-apple-ios-sim
          env SLOW_TESTS=1 cargo test -p rind -p rind-rustls -p rind-jsonwebtoken -p rind-object-store -p rind-rcgen -p rind-rand-core -p rind-ring -p rind-aws-lc-rs -p rind-dimpl -p rind-openmls -p rind-str0m --target aarch64-apple-ios-sim --release

  # cross's images (see Cross.toml) hold an Android system for the tests, and
  # run aarch64, armv7, and i686 under qemu-user. The aarch64 and armv7 CPUs
  # have the crypto extension; i686's Atom N270 has none of x86's.
  # armv7 Linux covers the paths without it. ARMv5TE runs the portable backend.
  android:
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            expect: RIND_TEST_ARM_CRYPTO_EXT=1
          - target: armv7-linux-androideabi
            expect: RIND_TEST_ARM_NEON=1 RIND_TEST_ARM_CRYPTO_EXT=1
          - target: x86_64-linux-android
            expect: ""
          - target: i686-linux-android
            expect: ""
          - target: arm-linux-androideabi
            expect: ""

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff

      # The CPU test reruns itself in a child process, which the kernel hands
      # to qemu-user only through binfmt_misc.
      - name: Install qemu-user's binfmt handlers
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user-binfmt

      # Optimised for qemu, but keeping the checks a debug build has.
      - name: Run tests
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: true
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: true
        run: env ${{ matrix.expect }} cross test -p rind -p rind-rustls -p rind-jsonwebtoken -p rind-object-store -p rind-rcgen -p rind-rand-core -p rind-ring -p rind-aws-lc-rs -p rind-dimpl -p rind-openmls -p rind-str0m --locked --release --target ${{ matrix.target }}
