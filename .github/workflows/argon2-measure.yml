name: argon2-measure

# Measures the gated Argon2 fills for quest/m4/protocols/argon2-simd.md.
on:
  workflow_dispatch:
  push:
    branches: [wip/argon2-measure]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Record CPU
        run: |
          mkdir -p out
          lscpu | tee out/lscpu.txt
          grep -m1 -E '^(Features|flags)' /proc/cpuinfo | tee out/features.txt
          rustc -vV | tee out/rustc.txt
          git rev-parse HEAD | tee out/commit.txt

      - name: Tests (default)
        run: cargo test -p rind --lib argon2 2>&1 | tee out/test-default.txt

      - name: Tests (gated)
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            RUSTFLAGS='--cfg rind_argon2_neon' CARGO_TARGET_DIR=target-test-gated \
              cargo test -p rind --lib argon2 2>&1 | tee out/test-gated.txt
          else
            gates='--cfg rind_argon2_ssse3'
            grep -qw avx512f out/features.txt && gates='--cfg rind_argon2_avx512'
            RUSTFLAGS="$gates" CARGO_TARGET_DIR=target-test-gated \
              cargo test -p rind --lib argon2 2>&1 | tee out/test-gated.txt
          fi
          grep -E 'neon_matches_scalar|matches_portable|test result' out/test-*.txt

      - name: Bench (3 interleaved rounds)
        env:
          PIN_CPU: "2"
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            configs="default neon"
            grep -qw sha3 out/features.txt && configs="$configs neon-plain"
            base=default
          else
            configs="default portable ssse3"
            grep -qw avx512f out/features.txt && configs="$configs avx512"
            base=portable
          fi
          echo "$base" > out/base.txt
          .github/argon2-measure/run.sh out/bench $configs

      - name: Summary
        if: always()
        run: |
          python3 .github/argon2-measure/summary.py out/bench "$(cat out/base.txt)" | tee out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: argon2-${{ matrix.os }}
          path: out
