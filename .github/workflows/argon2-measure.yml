name: argon2-measure

# Measures candidate tunings of the plain NEON Argon2 fill against the
# per-core pick and the portable permutation. quest/m4/protocols/argon2-simd.md.
on:
  workflow_dispatch:
  push:
    branches: [wip/argon2-neon-tune]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tree before NEON became the default: the portable permutation.
  BASE_REV: 52e0ed733b69c14253d1ffb5a8d310cd4c453a8d

jobs:
  measure:
    name: measure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Record CPU
        run: |
          mkdir -p out
          lscpu | tee out/lscpu.txt
          grep -m1 -E '^(Features|flags)' /proc/cpuinfo | tee out/features.txt
          rustc -vV | tee out/rustc.txt
          git rev-parse HEAD | tee out/commit.txt
          echo "$BASE_REV" > out/base-commit.txt

      - name: Tests (default)
        run: cargo test -p rind --lib argon2 2>&1 | tee out/test-default.txt

      - name: Tests (each candidate)
        run: |
          for f in rider4 sri; do
            RUSTFLAGS="--cfg rind_argon2_try_$f" CARGO_TARGET_DIR=target-test-$f \
              cargo test -p rind --lib argon2 2>&1 | tee out/test-$f.txt
          done
          grep -E 'matches_portable|neon_matches_scalar|test result' out/test-*.txt

      - name: Bench (3 interleaved rounds)
        env:
          PIN_CPU: "2"
        run: |
          full=$(git rev-parse "$BASE_REV")
          git worktree add ../base-tree "$full"
          git worktree add ../pick-tree origin/wip/argon2-neon-pick
          .github/argon2-measure/run-specs.sh out/bench .github/argon2-measure/specs-neoverse.txt

      - name: Summary
        if: always()
        run: |
          python3 .github/argon2-measure/summary.py out/bench base | tee out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: argon2-neon-tune-${{ matrix.os }}
          path: out
