name: argon2-hosts

# Times every Argon2 fill against portable and RustCrypto on each runner CPU.
# quest/m4/protocols/argon2-simd.md
on:
  workflow_dispatch:
  push:
    branches: [wip/argon2-hosts]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-22.04, macos-14, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Tests on this CPU
        run: |
          mkdir -p out
          cargo test -p rind --lib argon2 2>&1 | tee out/test.txt
          grep -E 'matches_portable|neon_matches_scalar|test result' out/test.txt

      - name: Bench
        env:
          WORK: ${{ runner.temp }}/argon2
        run: |
          bash .github/argon2-measure/host-bench.sh
          cp -r "$WORK"/out-*/host.txt "$WORK"/out-*/summary.md "$WORK"/out-*/specs.txt out/
          cp -r "$WORK"/out-*/bench out/bench
          cat out/host.txt out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: argon2-hosts-${{ matrix.os }}
          path: out
