name: Release

# The job writes through the GitHub App token, never GITHUB_TOKEN.
permissions:
  contents: read

# Only one release job can run at a time.
concurrency:
  group: release
  cancel-in-progress: false

# release-plz opens a release PR from `main` and publishes once that PR merges
# (release_always = false in .release-plz.toml), so an ordinary merge never
# publishes on its own.
on:
  push:
    branches:
      - main
    paths:
      - "rind*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - ".release-plz.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  release:
    name: Plz
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'moq-dev' && github.ref == 'refs/heads/main' }}
    # The environment, which only `main` can deploy to, holds the App key, and
    # crates.io trusts only this workflow in it, so a workflow on another
    # branch can neither read the key nor publish.
    environment: publish
    permissions:
      contents: read
      # release-plz exchanges the job's OIDC token for a short-lived crates.io
      # publish token (trusted publishing).
      id-token: write
    outputs:
      pyrind: ${{ steps.pypi.outputs.pyrind }}
      pyrind-cryptography: ${{ steps.pypi.outputs.pyrind-cryptography }}

    steps:
      # A GitHub App token, since the repository does not let GITHUB_TOKEN open
      # pull requests.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - uses: ./.github/actions/nix

      - name: Release
        run: nix develop --command just release "$BEFORE"
        env:
          # `main` before this push, so a release PR that landed mid-batch still
          # publishes; empty when dispatched.
          BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      # release-plz tags pyrind's version rather than publishing it, and does
      # not know pyrind-cryptography.
      - name: Find unpublished PyPI releases
        id: pypi
        run: |
          for package in pyrind pyrind-cryptography; do
            ref=$(nix develop --command sh/pypi-unpublished.sh "$package")
            echo "$package=$ref" >>"$GITHUB_OUTPUT"
          done

  pyrind-wheels:
    name: pyrind wheels
    needs: release
    if: needs.release.outputs.pyrind != ''
    permissions:
      contents: read
    uses: ./.github/workflows/python.yml
    with:
      ref: ${{ needs.release.outputs.pyrind }}

  # Publishes to PyPI by trusted publishing, which trusts this workflow in the
  # `publish` environment, so no PyPI token is stored anywhere.
  pyrind-publish:
    name: pyrind to PyPI
    needs: [release, pyrind-wheels]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pyrind-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A retry after a partial upload sends only what PyPI lacks.
          skip-existing: true

  # Pure Python, so one wheel and the sdist. Built in a job without the
  # `publish` environment, so the build backend never holds a publish token.
  pyrind-cryptography-build:
    name: pyrind-cryptography build
    needs: [release, pyrind-publish]
    # After pyrind-publish, so a release of both installs the new pyrind
    # below, but also when pyrind-publish is skipped for having nothing to do.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.pyrind-cryptography != '' && needs.pyrind-publish.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.pyrind-cryptography }}
          persist-credentials: false

      # The oldest CPython it supports.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install build==1.6.1
          python -m build --outdir dist rind-python/cryptography

      # Installs pyrind from PyPI, so a version requiring a pyrind PyPI lacks
      # fails here instead of publishing.
      - name: Install the wheel
        run: |
          python -m pip install dist/*.whl
          python -c "from pyrind_cryptography.hazmat.primitives import hashes; h = hashes.Hash(hashes.SHA256()); h.update(b''); print(h.finalize().hex())"

      # Not named pyrind-*, which pyrind-publish downloads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cryptography-dist
          path: dist/*
          if-no-files-found: error

  pyrind-cryptography-publish:
    name: pyrind-cryptography to PyPI
    needs: pyrind-cryptography-build
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cryptography-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
