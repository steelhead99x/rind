name: Prove
description: Run an `admin/prove` check that the prove workflow caches, and on main save its key once it passes.

inputs:
  check:
    description: The check's `admin/prove` arguments, `hol-light <arch>` or `cosim`, which `admin/prove key` takes too.
    required: true
  key:
    description: The key the workflow's `keys` job computed for the check, empty where it computed none.
    required: true

runs:
  using: composite
  steps:
    # On a push to main, the job waited for any other run checking this key,
    # which may have saved it since `keys` looked.
    - name: Look up
      id: cache
      if: github.event_name == 'push' && inputs.key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tmp/prove/keys
        key: ${{ inputs.key }}
        lookup-only: true

    # A key that differs from the one `keys` looked up would save an entry no
    # lookup finds, so every pull request would miss without turning red.
    - name: Check
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CHECK: ${{ inputs.check }}
        LOOKED_UP: ${{ inputs.key }}
      run: |
        nix develop .#hol-light --command admin/prove $CHECK
        key=$(<".tmp/prove/keys/${CHECK// /-}")
        echo "checked $key"
        if [[ -n $LOOKED_UP && $key != "$LOOKED_UP" ]]; then
          echo "::error::admin/prove $CHECK checked $key, but keys looked up $LOOKED_UP"
          exit 1
        fi

    # The key of what this job checked, rather than the input, so an entry
    # names the inputs that passed.
    - name: Passed
      id: passed
      if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: bash
      env:
        CHECK: ${{ inputs.check }}
      run: |
        key=$(<".tmp/prove/keys/${CHECK// /-}")
        echo "key=$key" >>"$GITHUB_OUTPUT"

    - name: Save
      if: steps.passed.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tmp/prove/keys
        key: ${{ steps.passed.outputs.key }}
