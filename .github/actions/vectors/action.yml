name: Fetch test vectors
description: Check out the Wycheproof, CAVP, and CCTV submodules the tests read, and no other.

runs:
  using: composite
  steps:
    - shell: bash
      # checkout drops its token. A macOS credential helper then asks for a
      # username instead of cloning these public repositories anonymously.
      run: git -c credential.helper= submodule update --init --depth 1 thirdparty/cavp thirdparty/cctv thirdparty/wycheproof
