include: package:lints/recommended.yaml

analyzer:
  exclude:
    # A Flutter app, analyzed only with Flutter.
    - integration/**
    # A package of its own, which sh/dart.sh analyzes on its own.
    - cryptography/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - public_member_api_docs
