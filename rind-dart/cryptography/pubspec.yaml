name: rind_cryptography
description: >-
  The cryptography package's Cryptography on rind, a pure-Rust library, for
  what rind covers: one line moves an app's existing code onto rind.
version: 0.1.0
repository: https://github.com/kixel-ai/rind/tree/main/rind-dart/cryptography
issue_tracker: https://github.com/kixel-ai/rind/issues
topics:
  - cryptography
  - crypto
  - ffi
  - encryption

# No web: rind has no wasm build.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  cryptography: ^2.9.0
  rind: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.33.0

# This repository's own runs build rind from source, as rind's own pubspec
# explains. pub reads user-defines only from the app's own pubspec, so this
# never reaches a dependent app.
hooks:
  user_defines:
    rind:
      build_from_source: true
