  'rind/src/low/generic/mont\.rs:\d+:\d+: replace \| with \^ in (cmp_lt_limbs|mod_double|mont_mul_limbs|sub_limbs_masked)$',
  'rind/src/low/generic/limb32\.rs:\d+:\d+: replace \| with \^ in join$',
  'rind/src/low/generic/chacha20\.rs:\d+:\d+: replace \| with \^ in quarter_round$',
  'rind/src/low/generic/mldsa_poly\.rs:\d+:\d+: replace \| with \^ in (mldsa_polyz_unpack_17|mldsa_polyz_unpack_19|mldsa_rej_uniform_vartime)$',
  'rind/src/low/generic/mlkem\.rs:\d+:\d+: replace \| with \^ in mlkem_frombytes$',
