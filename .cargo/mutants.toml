  'rind/src/low/generic/p384_mul32\.rs:\d+:\d+: replace \| with \^ in sqr_wide$',
  'rind/src/low/generic/p521\.rs:\d+:\d+: replace \| with \^ in (booth_w5|nonzero_u8|select_words)$',
