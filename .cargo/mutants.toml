# cargo-mutants' settings. Run it through `admin/mutants`, which also skips
# generated assembly and the code this host's architecture never compiles.

# Runs each mutant's tests in parallel, in about half `cargo test`'s time.
test_tool = "nextest"

exclude_globs = [
  # Constants imported with aws-lc's, BoringSSL's, and OpenSSL's assembly,
  # which proofs and differential tests own.
  "rind/src/low/*/aws_lc/**",
  "rind/src/low/*/boringssl/**",
  "rind/src/low/*/openssl/**",
  # Test-only code under a `cfg(test)` cargo-mutants does not recognise.
  # See UPSTREAM.md, "cargo-mutants misses compound `cfg(test)`s".
  "rind/src/low/tests.rs",
  "rind/src/low/guard_pages.rs",
  # `abi`'s armv7 half, which no campaign runs.
  "rind/src/low/abi/arm.rs",
  # Scanner fixtures, compiled only by admin/ct-vartime, never by the tests.
  "rind/src/low/vartime_planted.rs",
  # Tools, not libraries.
  "rind-bench/**",
  "rind-cpuid/**",
  "rind-timing/src/cases.rs",
  "fuzz/**",
  # The FIPS module, which refuses the CPUs admin/mutants masks features on;
  # its differential and break tests cover what it adds to rind.
  "rind-fips/**",
]

# Each surviving mutant no test can catch, with why. Match one by its file,
# function, mutation, and if needed column, never its line, which any edit
# above it moves; pin a line only where nothing else tells it from a caught
# mutant, saying so. `admin/mutants --pins` checks that each entry, and each
# alternative in it, still matches a mutant.
exclude_re = [
  # Test helpers, in `tests` modules whose `cfg` also names an architecture.
  # See UPSTREAM.md, "cargo-mutants misses compound `cfg(test)`s".
  '\btests::',
  # The negative entries of ML-KEM's constant tables; every unary minus in
  # these files is one.
  'mlkem(_poly)?\.rs:\d+:\d+: delete -$',
  # Equivalent: an OR of values that never share a set bit, such as packed
  # bit fields, or a carry and a borrow that cannot both occur, is their
  # exclusive or. So is an AND of flags that always agree their OR, and
  # `1 << 0` is `1 >> 0`, as `1 << 8` is `1 >> 8` in the byte kept.
  'rind/src/mid/half_size\.rs:\d+:\d+: replace \| with \^ in U256::(from|shl)$',
  'rind/src/high/asn1\.rs:\d+:\d+: replace \| with \^ in (Parser<\x27a>::take_len|Tag::context)$',
  'rind/src/high/pkcs1\.rs:\d+:33: replace \^ with \| in decode_oaep$',
  'rind/src/high/pkcs1\.rs:\d+:\d+: replace \^= with \|= in decode_oaep$',
  'rind/src/high/rsa\.rs:\d+:\d+: replace \| with \^ in public_exponent$',
  'rind/src/high/sec1\.rs:\d+:\d+: replace \| with \^ in is_public_key$',
  'rind/src/low/aarch64/aes_gcm\.rs:\d+:\d+: replace \| with \^ in (inc32|lengths)$',
