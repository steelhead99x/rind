  'rind/src/low/x86_64/mlkem_sample_poly_ntt_8x\.rs:\d+:\d+: replace \+ with \* in _squeeze_rate_and_reject$',
  'rind/src/mid/rsa_priv\.rs:\d+:78: replace / with \*$',
  'rind/src/mid/rsa_priv\.rs:\d+:44: replace \+ with \*$',
  'rind/src/mid/rsa_priv\.rs:\d+:15: replace \+ with \*$',
  'rind/src/mid/rsa_priv/exponents\.rs:\d+:56: replace \* with \+ in Exponents::derive$',
  'rind-openmls/src/provider\.rs:\d+:15: replace \+ with \* in <impl OpenMlsCrypto for RustCrypto>::sign$',
  # Equivalent: a comparison whose two forms differ only where both branches
  # give the same result, or a step that computes the same value another way,
  # such as squaring rather than multiplying to the same power.
  # Ed25519's non-adjacent forms: no digit is zero where its sign is tested,
  # past 64 bits a window's extra bits are masked off, and a borrow never
