[package]
name = "rind-rustcrypto"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
homepage = "https://rind.kixel.ai"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "RustCrypto's traits on rind"
categories = ["cryptography"]
rust-version.workspace = true
readme = "README.md"

# Adapts several upstreams that each version on their own, so its version is
# its own and sh/adapter-versions.sh skips it; a feature per trait crate and
# version keeps a new major of one from being a breaking release here.
[package.metadata.rind]
adapts-several-upstreams = true

[features]
# Every family this crate implements, so a workspace test run covers them; a
# consumer that wants fewer sets default-features = false and names its own.
default = ["digest-0_11", "aead-0_6", "signature-3"]
# Each feature turns on the traits of one released version of one trait crate.
# There is no `kem-0_3`: see the README's section on what rind cannot back.
digest-0_11 = ["dep:digest"]
aead-0_6 = ["dep:aead"]
signature-3 = ["dep:signature", "dep:ed25519", "dep:ecdsa", "dep:p256", "dep:p384", "dep:p521", "dep:ml-dsa", "dep:rsa"]

[dependencies]
rind = { version = "0.3.2", path = "../rind" }
digest = { version = "0.11.3", default-features = false, features = ["mac"], optional = true }
aead = { version = "0.6.1", default-features = false, features = ["alloc"], optional = true }
signature = { version = "3.0.0", default-features = false, optional = true }
ed25519 = { version = "3", default-features = false, optional = true }
ecdsa = { version = "0.17", default-features = false, features = ["der"], optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdsa-core"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["ecdsa-core"], optional = true }
p521 = { version = "0.14", default-features = false, features = ["ecdsa-core"], optional = true }
ml-dsa = { version = "0.1.2", default-features = false, optional = true }
rsa = { version = "0.10", default-features = false, features = ["encoding", "pkcs1v15"], optional = true }

[dev-dependencies]
sha2 = "0.11"
sha3 = "0.12"
hmac = "0.13"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
rsa = { version = "0.10", features = ["encoding", "pkcs1v15"] }
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
p521 = { version = "0.14", features = ["ecdsa"] }
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
