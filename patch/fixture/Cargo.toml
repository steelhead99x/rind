[package]
name = "patch-fixture"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, so the patch below applies to it alone.
[workspace]

# Each of these calls ring itself, with no way to pick another backend.
[dependencies]
bytes = "1"
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# The line a binary adds. sh/patch.sh also patches rind-ring to this checkout.
[patch.crates-io]
ring = { git = "https://github.com/kixel-ai/rind-patch" }
