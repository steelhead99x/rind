# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Review guidance for this cryptography library. REVIEW.md and CONTRIBUTING.md
# remain the source of truth; these instructions aim the review at the paths
# where those rules apply.
language: en-US
tone_instructions: "Terse and specific. Cite the file, line, and the rule broken. Treat security and performance claims as assertions to verify."
reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    base_branches:
      - ".*"
  path_filters:
    - "!thirdparty/**"
    - "!rind/src/testdata/**"
    - "!**/*.lock"
    - "!benchmarks/**/*.json"
    - "!**/*.{svg,png,jpg}"
  path_instructions:
    - path: "**/*.{rs,s,S}"
      instructions: >-
        rind is a cryptography library. Flag secret-dependent branches,
        secret-dependent indexing or memory access, and variable-time operations
        (division, remainder, floating point, data-dependent early exit) on
        secret values. Declassifying a secret-derived value and then branching
        or indexing on it is a finding unless the value is shown to be public.
        New secret paths should be marked for constant-time testing (low::ct
        helpers and admin/ctgrind). Public variable-time functions should be
        listed by exact name in admin/ct-vartime.toml.

        Every unsafe block needs a SAFETY comment that states the invariants
        that make it sound, and those invariants must be checkable from the
        surrounding code. Flag new unsafe that exists only for cleanup or
        convenience without that justification.

        Inline asm! and .s/.S assembly must match the calling convention and
        clobber list, must not use secret-dependent control flow or addresses,
        and should stay consistent with any formal proof or admin/prove-bytes
        contract for the routine.

        Key types and keyed state must be zeroized (low::zeroise or
        low::zeroise_value under the wipe feature). Heap scratch derived from a
        private key must be wiped. Do not demand wiping of digest contexts,
        plaintext, or unrelated stack temporaries.

        Primitive or encoding changes need known-answer tests (Wycheproof, RFC,
        or CAVP/CCTV as applicable) and, where practical, a differential test
        against a reference such as aws-lc-rs. Tests should check values, not
        only lengths, and should cover edge cases (zero, empty, malformed
        encodings, maximum lengths).

        Performance claims in the PR, comments, or docs must match measured
        before/after numbers. Flag unsourced speedups, numbers from a different
        host or build, or a claim that a change helps a CPU when the commit
        says it was not measured or was slower there. Follow CONTRIBUTING.md
        for recording gaps in benchmarks/gaps.toml.
    - path: "rind/src/low/**/aws_lc/**"
      instructions: >-
        Generated by admin/import-aws-lc and admin/parse-asm; reproduce with
        admin/regenerate. Do not leave line-level style or micro-optimization
        nits. Flag hand-edits, a pin mismatch, or an incomplete update (for
        example only one of the Apple and Linux assembly variants).
    - path: "rind/src/low/**/boringssl/**"
      instructions: >-
        Generated by admin/import-boringssl and admin/parse-asm; reproduce with
        admin/regenerate. Do not leave line-level style or micro-optimization
        nits. Flag hand-edits or a pin mismatch.
    - path: "rind/src/low/**/openssl/**"
      instructions: >-
        Generated by admin/import-openssl and admin/parse-asm; reproduce with
        admin/regenerate. Do not leave line-level style or micro-optimization
        nits. Flag hand-edits or a pin mismatch.
    - path: "rind/src/low/**/hacl/**"
      instructions: >-
        Generated by admin/import-hacl; reproduce with admin/regenerate. Do not
        leave line-level style or micro-optimization nits. Flag hand-edits or a
        pin mismatch.
    - path: "rind/src/mid/p256/precomp.rs"
      instructions: >-
        Generated by admin/p256-precomp (via admin/regenerate). Do not nitpick
        table contents line by line. Flag a hand-edit or a generator change
        without regenerating the table.
    - path: "rind/src/mid/p384/precomp.rs"
      instructions: >-
        Generated by admin/p384-precomp (via admin/regenerate). Do not nitpick
        table contents line by line. Flag a hand-edit or a generator change
        without regenerating the table.
    - path: "rind/src/mid/p521/precomp.rs"
      instructions: >-
        Generated by admin/p521-precomp (via admin/regenerate). Do not nitpick
        table contents line by line. Flag a hand-edit or a generator change
        without regenerating the table.
    - path: "benchmarks/**"
      instructions: >-
        Check that claimed speedups, slowdowns, and gap entries are honest:
        they must cite a measured comparison, name the host and build, and not
        generalize a result to a CPU or size that was not measured.
    - path: "{BENCHMARKS.md,ALGORITHMS.md,TESTING.md,CONTRIBUTING.md,REVIEW.md}"
      instructions: >-
        Documentation claims about tests, constant-time coverage, or
        performance must match the code and the measured results. Flag
        unsourced numbers and statements the tests do not support.
