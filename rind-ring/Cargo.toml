[package]
name = "rind-ring"
version = "0.17.4"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "ring 0.17's API backed by rind"
categories = ["cryptography"]
rust-version.workspace = true
readme = "README.md"
# ring's own tests and test vectors, under their own licenses.
exclude = ["tests/ring"]

# The ring version whose API this crate offers, which its own version tracks
# (sh/adapter-versions.sh), since it implements ring rather than depending on it.
[package.metadata.rind]
upstream = "0.17"

# The provider admin/adapter-api diffs this crate's API against.
[package.metadata.rind.api]
crate = "ring"
module = ""
# Items rind cannot back, which the README names.
omitted = [
  "aead::chacha20_poly1305_openssh",
  "io",
  "test",
  "deprecated_test",
  "test_file",
  "rsa::KeyPair::from_components",
  "rsa::KeyPairComponents",
  "signature::RsaEncoding::encode",
]

# ring's feature names, so a manifest naming them builds unchanged. As in ring,
# `alloc` gates RSA and `std` the errors' `std::error::Error` impls.
# `wasm32_unknown_unknown_js` enables rind's `wasm_js`, which selects
# getrandom's JavaScript backend, as ring's feature does. rind's random
# source already falls back to `/dev/urandom`, and the rest pick platforms,
# code paths, or tests rind lacks.
[features]
default = ["alloc", "dev_urandom_fallback"]
alloc = []
dev_urandom_fallback = []
less-safe-getrandom-custom-or-rdrand = []
less-safe-getrandom-espidf = []
slow_tests = []
std = ["alloc"]
test_logging = []
unstable-testing-arm-no-hw = []
unstable-testing-arm-no-neon = []
# ring's name for getrandom's JavaScript backend on wasm32-unknown-unknown.
# Forwarded to rind: a direct getrandom here would enable `wasm_js` only if
# cargo merged it with rind's copy.
wasm32_unknown_unknown_js = ["rind/wasm_js"]

[dependencies]
# `wasm_js` is not in the published rind 0.3.2. This path dependency is the
# workspace copy. Publish rind with that feature and bump this requirement
# in the same release, or a crates.io build of `wasm32_unknown_unknown_js` fails.
rind = { version = "0.3.2", path = "../rind" }
untrusted = "0.9"

[dev-dependencies]
aws-lc-rs = { version = "1.16", default-features = false, features = ["alloc", "prebuilt-nasm", "non-fips"] }
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
hex = { version = "0.4", features = ["serde"] }
proptest = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
untrusted = "0.9"
