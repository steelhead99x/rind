[package]
name = "rind"
version = "0.3.2"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
license = "(Apache-2.0 OR ISC OR MIT-0) AND (Apache-2.0 OR ISC OR MIT) AND Apache-2.0 AND ISC AND BSD-3-Clause"
readme = "README.md"
description = "Pure-Rust cryptography for MoQ, forked from graviola"
categories = ["network-programming", "cryptography"]
rust-version.workspace = true

# One target per backend: x86_64, aarch64, and i686 for the portable one.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "i686-unknown-linux-gnu"]

[features]
__ctgrind = ["dep:crabgrind"]

[dependencies]
cfg-if = "1"
getrandom = "0.4"
crabgrind = { version = "0.4", optional = true }

# The portable backend, which armv7 builds on: libcrux's portable Rust, with
# no C or intrinsics features enabled, fiat-crypto's for the NIST curves, and
# curve25519-dalek's for X25519 and Ed25519. The cfg is build.rs's choice of
# the arm or portable backend, which a manifest cannot read, so armv7 builds
# libcrux-sha2 too, though it runs aws-lc's assembly for SHA-512. Every
# bare-metal target still builds these crates, because the manifest cannot
# see which backend build.rs picked. A bare-metal x86_64 target with SSE2
# and soft-float cleared, or a NEON aarch64 target, runs the assembly
# backend anyway. An aarch64 target without NEON, and `x86_64-unknown-none`
# without SSE2, stay portable.
[target.'cfg(any(rind_portable, target_endian = "big", target_os = "none", all(target_arch = "aarch64", not(target_feature = "neon")), not(any(target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
curve25519-dalek = { version = "5", default-features = false, features = ["precomputed-tables"] }
fiat-crypto = { version = "0.3", default-features = false }
libcrux-sha2 = { version = "0.0.9", features = ["expose-hacl"] }

# armv7's ChaCha20 setup and its Poly1305 without NEON. A portable build
# uses HACL*'s Poly1305 only from tests. build.rs sends a little-endian
# ARMv7-or-later target that is not bare metal, not M-profile, and has
# 64-bit atomics to the arm backend, and everything else, including ARMv6,
# ARMv5TE, M-profile, and every `none` triple, to portable. A manifest cannot
# read that choice, nor the unstable `v7` feature (UPSTREAM.md). It can read
# `target_os` and `target_has_atomic`: every standard hosted A-profile triple
# has 64-bit atomics, and no ARMv5TE triple does. build.rs requires them too,
# so a custom ARMv7 target without them stays portable and compiles, and
# loses the NEON assembly. Hosted ARMv6 has 64-bit atomics and stays
# portable, so it still builds these crates and does not call them.
[target.'cfg(all(target_arch = "arm", target_endian = "little", not(rind_portable), not(target_os = "none"), target_has_atomic = "64"))'.dependencies]
libcrux-hacl-rs = { version = "0.0.6", features = ["alloc"] }
libcrux-macros = "0.0.4"
libcrux-poly1305 = { version = "0.0.7", features = ["expose-hacl"] }

# Reads the AArch32 crypto extension's HWCAP2 bits.
[target.'cfg(all(target_arch = "arm", target_endian = "little", not(rind_portable), any(target_os = "linux", target_os = "android")))'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
# Argon2id's differential tests, since aws-lc-rs has no Argon2.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# BLAKE2b's differential reference, since aws-lc-rs has no BLAKE2b.
blake2 = { version = "0.11", default-features = false }
# HACL*'s Poly1305, the differential reference for the 26-bit limbs. The arm
# backend also links these outside tests; see the target block above.
libcrux-hacl-rs = { version = "0.0.6", features = ["alloc"] }
libcrux-poly1305 = { version = "0.0.7", features = ["expose-hacl"] }
# ristretto255's differential reference; aws-lc-rs has no ristretto255.
curve25519-dalek = { version = "5", default-features = false, features = ["precomputed-tables"] }
# Checks armv7's NIST curve arithmetic against s2n-bignum's on the other arches.
fiat-crypto = { version = "0.3", default-features = false }
# CCTV gzips its ML-KEM modulus vectors.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
hex = { version = "0.4", features = ["serde"] }
# The reference for P-521's hash-to-curve, which aws-lc lacks, and for each
# curve's hash to a scalar, which aws-lc does not export.
p256 = { version = "0.14", default-features = false, features = ["group-digest"] }
p384 = { version = "0.14", default-features = false, features = ["group-digest"] }
p521 = { version = "0.14", default-features = false, features = ["group-digest"] }
# Without `fork` and `timeout`, which spawn processes wasm cannot.
proptest = { version = "1.5.0", default-features = false, features = ["std", "bit-set"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Maps the guard pages around the buffers in `low::guard_pages`.
[target.'cfg(unix)'.dev-dependencies]
libc = { version = "0.2", default-features = false }

# The differential tests' reference. Miri cannot run C, and aws-lc does not
# build for wasm, so those builds leave it out, along with every test that
# calls it.
[target.'cfg(not(any(miri, target_family = "wasm")))'.dev-dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["alloc", "prebuilt-nasm", "non-fips"] }
# aws-lc's XChaCha20-Poly1305, which aws-lc-rs does not expose.
aws-lc-sys = { version = "0.47", default-features = false }
# HPKE, which aws-lc-rs does not expose either; `hazmat` reads its private keys.
hpke-rs = { version = "0.8", default-features = false, features = ["hazmat", "rustcrypto", "std"] }
# SPAKE2+ differential tests. aws-lc-rs has no SPAKE2+.
pakery-crypto = { version = "0.6.2", default-features = false, features = ["std", "p256"] }
pakery-spake2plus = { version = "0.6.2", default-features = false, features = ["std", "test-utils"] }
# Matter PASE (draft-01). `test-support` injects the ephemeral scalars.
matter-crypto = { version = "0.5.1", default-features = false, features = ["test-support"] }
# RSA blind signatures, which aws-lc-rs does not offer.
blind-rsa-signatures = { version = "0.18", default-features = false }
# ECVRF, which aws-lc-rs does not offer: key transparency's `akd` for
# Edwards25519, and `vrf-rfc9381` for P-256.
akd_core = { version = "0.13", default-features = false, features = ["vrf"] }
vrf-rfc9381 = { version = "0.0.7", default-features = false, features = ["p256"] }
# SLH-DSA, which aws-lc-rs lacks: RustCrypto's, whose stable 0.1 predates the
# digest 0.11 stack the other dependencies share, and integritychain's.
fips205 = "0.5"
# Encodes RustCrypto's SLH-DSA keys.
pkcs8 = { version = "0.11", default-features = false, features = ["alloc"] }
slh-dsa = "=0.2.0-rc.5"
# RFC 9591's FROST, which aws-lc-rs does not offer: the Zcash Foundation's
# reference crates, with the `rand_core` their dealer and nonces draw from.
frost-ed25519 = { version = "3", default-features = false }
frost-ristretto255 = { version = "3", default-features = false }
frost-p256 = { version = "3", default-features = false }
# RFC 9497's OPRF and VOPRF, which aws-lc-rs does not offer: `voprf`, with
# the 0.13 RustCrypto curves its NIST suites run on, and the `rand_core` its
# blinds and proofs draw from.
voprf = { version = "0.5", default-features = false, features = ["alloc", "ristretto255-ciphersuite"] }
p256-voprf = { package = "p256", version = "0.13", default-features = false, features = ["hash2curve", "voprf"] }
p384-voprf = { package = "p384", version = "0.13", default-features = false, features = ["hash2curve", "voprf"] }
p521-voprf = { package = "p521", version = "0.13.3", default-features = false, features = ["hash2curve", "voprf"] }
rand_core-voprf = { package = "rand_core", version = "0.6", features = ["getrandom"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(coverage_nightly)",
  # Lets an optimised build honour `RIND_CPU_DISABLE_*`, for benches and ctgrind.
  "cfg(rind_cpu_disable)",
  # Plants the variable-time operations `admin/ct-vartime` must find.
  "cfg(rind_vartime_planted)",
  # Forces the portable backend, for testing it on x86_64 (see build.rs).
  "cfg(rind_portable)",
  # Builds the FIPS module's source, which draws every random value from its
  # DRBG (`src/fips_rng.rs`).
  "cfg(rind_fips)",
  # Builds the FIPS module so `RIND_FIPS_BREAK` corrupts the self-test it
  # names, as a lab checks each failure path (`src/fips.rs`).
  "cfg(rind_fips_break)",
  # curve25519-dalek's backend overrides, which armv7 refuses.
  'cfg(curve25519_dalek_bits, values("32", "64"))',
  'cfg(curve25519_dalek_backend, values("fiat", "serial", "simd", "avx512"))',
] }
