[package]
name = "rind"
version = "0.3.2"
edition = "2024"
repository = "https://github.com/moq-dev/rind"
license = "(Apache-2.0 OR ISC OR MIT-0) AND (Apache-2.0 OR ISC OR MIT) AND Apache-2.0 AND ISC AND BSD-3-Clause"
readme = "README.md"
description = "Pure-Rust cryptography for MoQ, forked from graviola"
categories = ["network-programming", "cryptography"]
rust-version.workspace = true

[features]
default = ["std"]
# The standard library: thread-local DIT guards, and the run-time CPU feature
# detection the x86_64 and aarch64 backends need. Without it rind is
# `#![no_std]` on `alloc`, for the portable backend's bare-metal targets such
# as `thumbv6m-none-eabi`.
std = ["alloc"]
# The heap, which rind needs: without `std`, the binary supplies a global
# allocator.
alloc = []
# Wipes keys, keyed state, and private-key heap scratch on drop.
wipe = []
__ctgrind = ["dep:crabgrind"]

[dependencies]
cfg-if = "1"
getrandom = "0.4"
crabgrind = { version = "0.4", optional = true }

# The portable backend, which armv7 builds on: libcrux's portable Rust, with
# no C or intrinsics features enabled, fiat-crypto's for the NIST curves, and
# curve25519-dalek's for X25519 and Ed25519. The cfg is build.rs's choice of
# the arm or portable backend, which a manifest cannot read, so armv7 builds
# libcrux-sha2 too, though it runs aws-lc's assembly for SHA-512.
[target.'cfg(any(rind_portable, target_endian = "big", not(any(target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
curve25519-dalek = { version = "5", default-features = false, features = ["precomputed-tables"] }
fiat-crypto = { version = "0.3", default-features = false }
libcrux-hacl-rs = { version = "0.0.6", features = ["alloc"] }
libcrux-macros = "0.0.4"
libcrux-poly1305 = { version = "0.0.7", features = ["expose-hacl"] }
libcrux-sha2 = { version = "0.0.9", features = ["expose-hacl"] }

# `ReuseCache`'s compare-and-swap, on targets such as ARMv6-M that lack one:
# the binary implements `critical-section` (on a single-core part such as
# the RP2040, by turning interrupts off).
[target.'cfg(not(target_has_atomic = "8"))'.dependencies]
portable-atomic = { version = "1.15", default-features = false, features = ["critical-section"] }

# Reads the AArch32 crypto extension's HWCAP2 bits.
[target.'cfg(all(target_arch = "arm", target_endian = "little", not(rind_portable), any(target_os = "linux", target_os = "android")))'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
# ristretto255's differential reference; aws-lc-rs has no ristretto255.
curve25519-dalek = { version = "5", default-features = false, features = ["precomputed-tables"] }
# Checks armv7's NIST curve arithmetic against s2n-bignum's on the other arches.
fiat-crypto = { version = "0.3", default-features = false }
# CCTV gzips its ML-KEM modulus vectors.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
hex = { version = "0.4", features = ["serde"] }
# The reference for P-521's hash-to-curve, which aws-lc lacks, and for each
# curve's hash to a scalar, which aws-lc does not export.
p256 = { version = "0.14", default-features = false, features = ["group-digest"] }
p384 = { version = "0.14", default-features = false, features = ["group-digest"] }
p521 = { version = "0.14", default-features = false, features = ["group-digest"] }
# Without `fork` and `timeout`, which spawn processes wasm cannot.
proptest = { version = "1.5.0", default-features = false, features = ["std", "bit-set"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Maps the guard pages around the buffers in `low::guard_pages`.
[target.'cfg(unix)'.dev-dependencies]
libc = { version = "0.2", default-features = false }

# The differential tests' reference. Miri cannot run C, and aws-lc does not
# build for wasm, so those builds leave it out, along with every test that
# calls it.
[target.'cfg(not(any(miri, target_family = "wasm")))'.dev-dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["alloc", "prebuilt-nasm", "non-fips"] }
# aws-lc's XChaCha20-Poly1305, which aws-lc-rs does not expose.
aws-lc-sys = { version = "0.47", default-features = false }
# HPKE, which aws-lc-rs does not expose either; `hazmat` reads its private keys.
hpke-rs = { version = "0.8", default-features = false, features = ["hazmat", "rustcrypto", "std"] }
# RSA blind signatures, which aws-lc-rs does not offer.
blind-rsa-signatures = { version = "0.18", default-features = false }
# ECVRF, which aws-lc-rs does not offer: key transparency's `akd` for
# Edwards25519, and `vrf-rfc9381` for P-256.
akd_core = { version = "0.13", default-features = false, features = ["vrf"] }
vrf-rfc9381 = { version = "0.0.7", default-features = false, features = ["p256"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(coverage_nightly)",
  # Lets an optimised build honour `RIND_CPU_DISABLE_*`, for benches and ctgrind.
  "cfg(rind_cpu_disable)",
  # Plants the variable-time operations `admin/ct-vartime` must find.
  "cfg(rind_vartime_planted)",
  # Forces the portable backend, for testing it on x86_64 (see build.rs).
  "cfg(rind_portable)",
  # Builds the FIPS module's source, which draws every random value from its
  # DRBG (`src/fips_rng.rs`).
  "cfg(rind_fips)",
  # curve25519-dalek's backend overrides, which armv7 refuses.
  'cfg(curve25519_dalek_bits, values("32", "64"))',
  'cfg(curve25519_dalek_backend, values("fiat", "serial", "simd", "avx512"))',
] }
