# The map admin/test-scope scopes `just check`'s rind tests with.
#
# [families]: each family's names. A file under rind/src/{low,mid,high}/
# belongs to every family one of its names matches: its directories below
# that layer and its file name up to the first dot, each matched whole. A
# file no family names is shared, and a diff that changes one runs every test.
# A unit test belongs to the families its module path names the same way, and
# one in a module no family names runs on every scoped run.
#
# [units]: unit tests that run a family's primitive from another family's
# module, and so belong to it too, as HPKE's suites run its AEADs.
#
# [tests.BINARY]: every test in rind/tests/BINARY.rs, by its name, a module
# prefix ending in `::`, or `*` for the whole binary, and the families it
# belongs to, `shared` for every scoped run. A test spanning families belongs
# to each, as Wycheproof's ECDSA vectors do to every curve, and so does one
# running a family's primitive inside another's protocol, as HPKE's do to its
# KEMs', KDFs', and AEADs' families. A hash a scheme fixes internally, such as
# Ed25519's SHA-512, does not make its tests the hash's, unless only such
# schemes reach its code, as only ML-KEM and ML-DSA run SHAKE four lanes at a
# time. A `[units]` name, module path and all, is checked against rind's unit
# tests on every run of them, since renaming a unit test or its module changes
# no file this map's self-test watches.

[families]
aes = ['aes[\w-]*', 'vpaes[\w-]*', 'bsaes[\w-]*', 'ghash[\w-]*', 'gcm\w*', 'compute_iv_stdcall', 'ctr', 'quic']
chacha = ['x?chacha[\w-]*', 'ChaCha20\w*', 'poly1305[\w-]*', 'poly_hash_ad_internal', 'vg_chacha20\w*', 'vg_poly1305\w*', 'quic']
hash = [
    'sha1[\w-]*', 'sha256[\w-]*', 'sha512[\w-]*', 'sha2', 'sha(_\w+)?', 'vg_(sha1|sha256|sha384|sha512|hmac|pbkdf2)\w*',
    'md5', 'digest', 'hash', 'hmac', 'hmac_drbg', 'hkdf', 'pbkdf2[\w-]*',
]
sha3 = ['sha3[\w-]*', 'keccak[\w-]*', 'vg_keccak\w*', 'digest']
p256 = ['[\w-]*[pnz]256[\w-]*', 'ecdsa', 'curve', 'sec1', 'agreement']
p384 = ['[\w-]*[pn]384[\w-]*', 'ecdsa', 'curve', 'sec1', 'agreement']
p521 = ['[\w-]*[pn]521[\w-]*', 'ecdsa', 'curve', 'sec1', 'agreement']
curve25519 = ['[\w-]*25519[\w-]*', 'ristretto255\w*', 'half_size', 'agreement']
rsa = [
    'rsa[\w-]*', 'vg_rsa\w*', 'blind_rsa', 'oaep', 'pkcs1', 'posint', 'mont', 'mont_exp', 'x86_64-mont5', 'armv4-mont',
    'bn_\w+', 'bignum_(kmul|ksqr|emontredc)\w*', 'extract_multiplier\w*',
]
mlkem = ['mlkem[\w-]*', 'vg_mlkem\w*', 'kem']
mldsa = ['mldsa[\w-]*', 'ml_dsa']
slhdsa = ['slhdsa', 'slh_dsa', 'sha256x8']
argon2 = ['argon2', 'blake2b']
hpke = ['hpke']
oprf = ['oprf', 'voprf']
frost = ['frost']
spake2plus = ['spake2plus']
vrf = ['vrf']

