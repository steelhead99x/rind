[package]
name = "rind-esp32c6"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Known-answer checks, stack and heap probes, and a sensor example for rind on riscv32imac (ESP32-C6). Not yet measured on hardware."

# Its own workspace and lockfile: nothing here builds for the host's gate
# except `cargo test`, and the firmware target needs flags the workspace lacks.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "qemu-kat"
path = "src/bin/qemu-kat.rs"
required-features = ["qemu"]

[features]
# `cargo test` checks every vector. `admin/esp32c6-riscv32` builds with
# `--no-default-features` and picks its own features.
default = ["all"]
# The qemu-user runner: a `no_std` binary that makes Linux syscalls. It runs
# the checks the other features include.
qemu = ["dep:linked_list_allocator", "dep:getrandom"]
# One feature per algorithm, so `admin/esp32c6-riscv32 size` can build each
# alone and take its code size as the difference from the empty build.
all = ["sha256", "sha512", "sha3-256", "hmac-sha256", "hkdf-sha256", "chacha20poly1305", "aes128-gcm", "aes256-gcm", "x25519", "ed25519", "mlkem768", "mldsa65", "p256-ecdsa", "sensor"]
sha256 = []
sha512 = []
sha3-256 = []
hmac-sha256 = []
hkdf-sha256 = []
chacha20poly1305 = []
aes128-gcm = []
aes256-gcm = []
x25519 = []
ed25519 = []
mlkem768 = []
mldsa65 = []
p256-ecdsa = []
# Valgrind's requests for tests/ctgrind.rs, which `admin/ctgrind esp32c6` runs.
ctgrind = ["rind/__ctgrind"]
# The sensor example, which needs these three.
sensor = ["ed25519", "chacha20poly1305", "hkdf-sha256"]

[dependencies]
rind = { path = "../../rind" }
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"], optional = true }
getrandom = { version = "0.4", optional = true }

[dev-dependencies]
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind esp32c6` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1
