[package]
name = "rind-esp32c6-firmware"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[features]
# `bench` times the algorithms after the checks. Without it the image is the
# LED status firmware: the checks, the LED, and the summary, no timing rows.
default = ["bench"]
bench = []

[dependencies]
rind-esp32c6 = { path = "..", features = ["all", "compare"] }
getrandom = "0.4"
esp-hal = { version = "1.2", features = ["esp32c6", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c6"] }
esp-println = { version = "0.18", default-features = false, features = ["esp32c6", "jtag-serial"] }
esp-alloc = { version = "0.11", features = ["esp32c6"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1
