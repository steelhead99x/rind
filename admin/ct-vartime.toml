[[public]]
function = "rind::mid::argon2::divisor"
why = "Divides 2^64 by the public lane count to build the Barrett multiplier for the per-block remainder. Both operands are public. 32-bit targets lower the wide division to a loop the scan does not report."
[public.holds]
"x86_64-unknown-linux-gnu" = "calls __udivti3"
"aarch64-unknown-linux-gnu" = "calls __udivti3"
"x86_64-unknown-linux-gnu+portable" = "calls __udivti3"
