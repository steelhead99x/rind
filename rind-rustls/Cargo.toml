[package]
name = "rind-rustls"
version = "0.23.4"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
homepage = "https://rind.kixel.ai"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "rustls CryptoProvider backed by rind"
categories = ["network-programming", "cryptography"]
rust-version.workspace = true
readme = "README.md"

# The provider admin/adapter-api diffs this crate's API against.
[package.metadata.rind.api]
crate = "rustls"
module = "crypto::aws_lc_rs"
features = ["aws_lc_rs"]
skip = { fips = "rustls's own fips feature builds AWS-LC's FIPS module; rind's `fips` is built and tested on its own" }

[dependencies]
rind = { version = "0.3.2", path = "../rind" }
# The module behind the `fips` feature, on glibc Linux x86_64 and aarch64. It
# is unpublished, so rind-rustls cannot be published with this dependency until
# it is.
rind-fips = { version = "0.1.0", path = "../rind-fips", optional = true }
# rind-rustls needs the standard library, as does how it reports HPKE errors
# through rustls's `OtherError`, whose fields depend on rustls's `std`.
rustls = { version = "0.23.20", default-features = false, features = ["std"] }

[dev-dependencies]
env_logger = "0.11"
hex = "0.4"
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does. Without that feature the calls are no-ops,
# and they compile on wasm, where the ML-KEM unit tests still name the crate.
crabgrind = { version = "0.4", default-features = false }

# aws-lc-rs does not build for wasm and ring needs a C compiler targeting it,
# so wasm leaves out the differential tests, and the examples, whose tokio
# needs the threads and sockets wasm lacks.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# The ML-DSA differential tests need aws-lc-rs's own key API, to expand a seed.
aws-lc-rs = { version = "1.19", default-features = false, features = ["alloc", "prebuilt-nasm", "non-fips"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "tls12", "logging"] }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto"] }
rustls = { version = "0.23.36", default-features = false, features = ["aws-lc-rs", "ring"] }
tokio = { version = "1.0", features = ["io-std", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false }

# rustls's: as there, `std` gates `Ticketer` and `tls12` the TLS 1.2 suites.
# rustls's `std` is always on, since rind-rustls needs it.
[features]
default = ["std", "tls12"]
std = []
tls12 = ["rustls/tls12"]
# Runs the TLS 1.3 key schedule and AES-GCM in rind-fips's module, and offers
# only what runs there by default. See the README, "FIPS".
fips = ["dep:rind-fips"]
