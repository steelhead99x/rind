[package]
name = "rind-aead"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/kixel-ai/rind"
homepage = "https://rind.kixel.ai"
license = "Apache-2.0 OR ISC OR MIT-0"
description = "RustCrypto's aead 0.6 traits on rind"
categories = ["cryptography"]
rust-version.workspace = true
readme = "README.md"

# `aes-gcm`'s and `chacha20poly1305`'s feature names for what `aead` gives:
# `alloc` the allocating `Aead`, `getrandom` and `rand_core` key and nonce
# generation, and `arrayvec` and `bytes` their buffers.
[features]
default = ["alloc", "getrandom"]
alloc = ["aead/alloc"]
arrayvec = ["aead/arrayvec"]
bytes = ["aead/bytes"]
getrandom = ["aead/getrandom"]
rand_core = ["aead/rand_core"]

[dependencies]
rind = { version = "0.3.2", path = "../rind", default-features = false }
aead = { version = "0.6.1", default-features = false }

[dev-dependencies]
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
# Requests reach valgrind only once `rind/__ctgrind` turns on crabgrind's default
# features, as `admin/ctgrind` does; otherwise they build as no-ops.
crabgrind = { version = "0.4", default-features = false }
