name = "verified-garbage"
defaultTargets = ["vg-cosim"]

# pyca/verified-garbage's ISA models, which `admin/import-vg-models` vendors
# byte for byte. They import Lean core and, in the scrub's `Proof/` closure
# that `Cosim.Progs.X86_64` computes its clearing's arguments with,
# Batteries, at the revision proofs/lake-manifest.json pins through Mathlib
# and VG's own manifest at REV pins too.
[[require]]
name = "batteries"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/batteries"
rev = "66e469188fe07963e5cf666c7d4433f45b8131c5"

[[lean_lib]]
name = "VerifiedGarbage"
globs = ["VerifiedGarbage.+"]

# rind's extension of VG's AArch64 model and the programs rind proves in
# it, with `rind-asm`, which prints their machine code for `admin/prove lean`
# to check against rind's build.
[[lean_lib]]
name = "RindIsa"
globs = ["RindIsa.+"]

[[lean_lib]]
name = "Cosim"
globs = ["Cosim.+"]

[[lean_exe]]
name = "vg-cosim"
root = "Cosim.Main"

# Prints the text of the `Prog`s rind's leakage axioms are about, which
# `admin/vg-bytes` checks against VG's assembly.
[[lean_exe]]
name = "vg-print"
root = "Cosim.PrintMain"

[[lean_exe]]
name = "rind-asm"
root = "RindIsa.Main"
