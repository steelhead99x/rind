name = "verified-garbage"
defaultTargets = ["vg-cosim"]

# pyca/verified-garbage's ISA models, which `admin/import-vg-models` vendors
# byte for byte. They import only Lean core.
[[lean_lib]]
name = "VerifiedGarbage"
globs = ["VerifiedGarbage.+"]

# rind's extension of VG's AArch64 model and the programs rind proves in
# it, with `rind-asm`, which prints their machine code for `admin/prove lean`
# to check against rind's build.
[[lean_lib]]
name = "RindIsa"
globs = ["RindIsa.+"]

[[lean_lib]]
name = "Cosim"
globs = ["Cosim.+"]

[[lean_exe]]
name = "vg-cosim"
root = "Cosim.Main"

[[lean_exe]]
name = "rind-asm"
root = "RindIsa.Main"
