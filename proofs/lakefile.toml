name = "rind"
defaultTargets = ["Rind"]
# Lake's artifact cache, which every checkout of the user on a host shares, so
# a new worktree takes the dependencies and unchanged modules another already
# fetched or built from it as hard links rather than unpacking or building
# copies of its own. Restore every artifact, not just the `.ilean` files Lake
# needs itself, since `lake env lean` reads `.olean` files from `.lake/build`.
enableArtifactCache = true
restoreAllArtifacts = true

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
# nightly-2026.11.03, whose release carries a prebuilt archive of this library.
rev = "ab34bd28458a08c150b7cbf1873e59af74588138"
subDir = "backends/lean"

# No module imports both targets: their translations share global names.
[[lean_lib]]
name = "Rind"
globs = ["Rind.+"]
# Lean's default 512 is too shallow for `Array.make`'s length proof of the
# 256-word rows of P-256's generator table in the translation.
leanOptions = { maxRecDepth = 1024 }
