[package]
name = "rind-fips-module"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
license = "(Apache-2.0 OR ISC OR MIT-0) AND (Apache-2.0 OR ISC OR MIT) AND Apache-2.0 AND ISC AND BSD-3-Clause"

[lib]
crate-type = ["cdylib"]

[features]
# The deterministic forms of the randomized services, which FIPS 203 and 204
# allow only for testing, for `rind-acvp`; `rind-fips`'s `__acvp` asks for
# them.
acvp = []

[dependencies]
rind = { path = "../../rind" }

[lints.rust]
# Set by `rind-fips`'s build script: the module's build, and its break build.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rind_fips)", "cfg(rind_fips_break)"] }
